<style>
/* Layout: full-bleed isometric map under a monochrome glass HUD — hairline panels with corner brackets, mono numerals, one cold-blue signal colour */
:root{

  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060708; --ground:#03060c; --solid:#0d0e11; --panel:rgba(10,11,13,.9);
  --sunk:#191b1f; --hover:#25282e; --line:rgba(255,255,255,.17);
  --ink:#f4f5f7; --ink-dim:#9ba2ad; --glow:#7fb1ff;
  --good:#6fdc9a; --badc:#ff9d8f; --bad:#ef5a47; --bad-ink:#190402;
  --zr:#5fbf6e; --zc:#4f9de6; --zi:#e8b84b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060708; --ground:#03060c; --solid:#0d0e11; --panel:rgba(10,11,13,.9);
  --sunk:#191b1f; --hover:#25282e; --line:rgba(255,255,255,.17);
  --ink:#f4f5f7; --ink-dim:#9ba2ad; --glow:#7fb1ff;
  --good:#6fdc9a; --badc:#ff9d8f; --bad:#ef5a47; --bad-ink:#190402;
  --zr:#5fbf6e; --zc:#4f9de6; --zi:#e8b84b; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.building{cursor:crosshair}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.hud-top,.hud-bot{position:fixed;left:0;right:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.hud-top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.hud-bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.hud-top>*,.hud-bot>*{pointer-events:auto;width:100%;max-width:820px}

.sign{background:var(--sign);border-radius:12px;box-shadow:inset 0 0 0 2px var(--sign),inset 0 0 0 4px var(--rim),0 6px 18px rgba(0,0,0,.35)}
.top{padding:9px 12px 10px;display:flex;flex-direction:column;gap:7px}
.row1,.row2{display:flex;align-items:center;gap:10px;min-width:0}
.ident{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.cityname{font-weight:800;font-size:17px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tier{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--sign-deep);background:var(--ink);border-radius:4px;padding:2px 6px 1px;white-space:nowrap}
.date{font-family:var(--f-num);font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:flex;background:var(--sign-deep);border-radius:7px;padding:2px}
.speed button{font-family:var(--f-num);font-size:11px;font-weight:700;padding:5px 7px 4px;border-radius:5px;color:var(--ink-dim);letter-spacing:-.08em;min-width:28px}

.money{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;padding:3px 8px;border-radius:7px;background:var(--sign-deep)}

.net.up{color:var(--good)}.net.down{color:var(--badc)}
.stat{display:flex;flex-direction:column;line-height:1.1}
.lbl{font-size:10px;letter-spacing:.1em;color:var(--ink-dim)}
.num{font-family:var(--f-num);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.rci{display:flex;gap:4px;align-items:flex-end;margin-left:auto}
.bar{display:flex;flex-direction:column;align-items:center;gap:2px}
.bar .track{width:9px;height:28px;background:var(--sign-deep);border-radius:2px;position:relative;overflow:hidden}
.bar .track::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:color-mix(in srgb,var(--ink) 35%,transparent)}
.bar .fill{position:absolute;left:0;right:0;transition:all .4s}
.bar span{font-size:9.5px;font-weight:800;color:var(--ink-dim)}
.iconbtn{height:34px;min-width:38px;padding:0 9px;border-radius:7px;background:var(--sign-deep);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}

.toast{pointer-events:none;background:var(--amber);color:var(--amber-ink);font-weight:600;font-size:13px;padding:7px 12px 5px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:tin .25s ease-out;max-width:100%;text-align:center}
.toast.warn{background:var(--bad);color:var(--bad-ink)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}

.tray{padding:8px;display:flex;flex-direction:column;gap:6px}
.toolinfo{display:flex;gap:8px;align-items:baseline;padding:2px 6px 0;font-size:12.5px;color:var(--ink-dim);min-height:18px;min-width:0}
.toolinfo b{color:var(--ink);font-weight:800;white-space:nowrap}
.toolinfo .cost{font-family:var(--f-num);color:var(--amber);margin-left:auto;white-space:nowrap}
.toolinfo .tip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tools,.subtools{display:flex;gap:4px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;padding:2px}

.subtools{background:var(--sign-deep);border-radius:9px;padding:5px}

.tool .tn{font-size:11.5px;font-weight:600;white-space:nowrap}
.tool.on{background:var(--amber);color:var(--amber-ink)}
.tool .chip{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:2px}
.tool .more{position:absolute;bottom:3px;right:5px;font-size:8px;opacity:.7}
.opt-card{flex:0 0 auto;min-width:108px;max-width:150px;text-align:left;padding:7px 9px 6px;border-radius:7px;background:var(--sign);display:flex;flex-direction:column;gap:1px}
.opt-card .on-name{font-weight:800;font-size:12.5px;white-space:nowrap}
.opt-card .oc{font-family:var(--f-num);font-size:11px;color:var(--amber)}
.opt-card .os{font-size:10.5px;color:var(--ink-dim);white-space:nowrap}
.opt-card.on{background:var(--amber);color:var(--amber-ink)}
.opt-card.on .oc,.opt-card.on .os{color:var(--amber-ink)}
.opt-card.locked{opacity:.45}
.sep{flex:0 0 2px;background:color-mix(in srgb,var(--ink) 20%,transparent);margin:6px 2px;border-radius:2px}

.panel{padding:14px 16px 14px;max-height:56vh;overflow:auto;touch-action:pan-y}
.panel h3{margin:0;font-size:16px;font-weight:800;text-wrap:balance}

.sub{font-size:12px;color:var(--ink-dim)}

.kv span:nth-child(even){font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.kv .tot{border-top:1px solid color-mix(in srgb,var(--ink) 25%,transparent);padding-top:5px;font-weight:800}
.good{color:var(--good)}.badc{color:var(--badc)}
.issue{margin-top:8px;font-size:12.5px;background:color-mix(in srgb,var(--bad) 18%,transparent);border-radius:6px;padding:6px 8px 4px;color:var(--badc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.opt.on{background:var(--amber);color:var(--amber-ink)}
.opt.on small{color:var(--amber-ink)}
.field{display:flex;flex-direction:column;gap:4px;margin:4px 0 12px;font-size:12px;color:var(--ink-dim)}
.field input{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:var(--sign-deep);border:0;border-radius:7px;padding:9px 10px 7px}
.sect{font-size:11px;letter-spacing:.1em;color:var(--ink-dim);margin:12px 0 6px;font-weight:600}
.btn{padding:9px 14px 7px;border-radius:8px;background:var(--ink);color:var(--sign-deep);font-weight:800;font-size:13px}
.btn.ghost{background:var(--sign-deep);color:var(--ink)}
.btn.danger{background:var(--bad);color:var(--bad-ink)}
.btn.big{padding:12px 18px 10px;font-size:15px;background:var(--amber);color:var(--amber-ink)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.55}
ol.steps li{margin-bottom:2px}
#spark{width:100%;height:46px;display:block;margin:4px 0 10px}

.tier.raid{background:var(--bad);color:var(--bad-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
body.raid .top{box-shadow:inset 0 0 0 2px var(--sign),inset 0 0 0 4px var(--bad),0 6px 18px rgba(0,0,0,.35)}
.opt.leader{flex-direction:row;gap:9px;align-items:flex-start}
.opt.leader>span:last-child{display:flex;flex-direction:column;gap:2px}
.av{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}

.iconbtn{position:relative}
.dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
@media (max-width:440px){.row2{gap:6px}.iconbtn{min-width:31px;padding:0 5px}}
.flag{display:inline-block;width:28px;height:19px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.35);flex:0 0 auto}
.flag.big{width:46px;height:31px}
.nlist{display:flex;flex-direction:column;gap:5px}
.nrow{display:grid;grid-template-columns:28px minmax(0,1fr) 78px auto;gap:9px;align-items:center;padding:8px 9px 6px;background:var(--sign-deep);border-radius:8px;text-align:left}
.nrow .nm{display:flex;flex-direction:column;min-width:0}.nrow .nm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nrow small{font-size:10.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.relbar{display:flex;flex-direction:column;gap:3px}.relbar>i{display:block;height:5px;border-radius:3px;background:var(--ink-dim)}
.stc{font-size:10.5px;font-weight:800;padding:3px 6px 1px;border-radius:4px;white-space:nowrap;background:#56635b;color:#fff}
.stc.war{background:var(--bad);color:var(--bad-ink)}.stc.ally{background:#2e9e5b}.stc.good{background:#3f8f6a}.stc.ok{background:#4f7d6a}.stc.tense{background:#b9772a}.stc.hostile{background:#a3412f}
.pend{background:color-mix(in srgb,var(--glow) 14%,transparent);border:1px solid color-mix(in srgb,var(--glow) 50%,transparent);border-radius:8px;padding:9px 10px 8px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px}
.pend .rowbtns{margin-top:6px}
ul.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
ul.news li{display:flex;gap:8px;line-height:1.4}ul.news li span{font-family:var(--f-num);font-size:11px;color:var(--ink-dim);flex:0 0 auto;padding-top:1px}
ul.news li.bad{color:var(--badc)}ul.news li.good{color:var(--good)}
.dhead{display:flex;gap:10px;align-items:center}.dhead h3{margin:0}.dhead .stc{margin-left:auto}
.meter{display:inline-block;width:70px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--ink) 15%,transparent);vertical-align:middle;overflow:hidden}.meter>i{display:block;height:100%;background:var(--amber)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.act{display:flex;flex-direction:column;gap:1px;text-align:left;padding:8px 9px 6px;border-radius:8px;background:var(--sign-deep)}
.act b{font-size:13px}.act small{font-size:10.5px;color:var(--ink-dim)}.act small:first-of-type{color:var(--amber);font-family:var(--f-num)}
.act:not(:disabled):hover{background:var(--sign-hi)}.act:disabled{opacity:.45;cursor:default}
@media (prefers-reduced-motion:reduce){.tier.raid{animation:none}}
.coach{padding:12px 14px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:inset 0 0 0 2px var(--sign),inset 0 0 0 4px var(--amber),0 6px 18px rgba(0,0,0,.35)}
.coach h3{margin:2px 0 0;font-size:16px;font-weight:800;text-wrap:balance}
.coach p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink)}.coach p b{color:var(--amber)}
.tuth{display:flex;align-items:center;gap:10px}.tutn{font-family:var(--f-num);font-size:11px;color:var(--ink-dim);white-space:nowrap}
.tutm{flex:1;width:auto;height:5px}.tutskip{font-size:12px;font-weight:700;color:var(--ink-dim);padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.tutb{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}.tutw{font-size:12px;color:var(--ink-dim);margin-right:auto}
.tutgo{background:var(--amber);color:var(--amber-ink)}
.tut-hl{outline:3px solid var(--amber);outline-offset:1px;animation:tutp 1.1s ease-in-out infinite}
@keyframes tutp{50%{outline-color:color-mix(in srgb,var(--glow) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.tut-hl{animation:none}}
.ticker{display:flex;align-items:center;gap:8px;padding:5px 10px 4px;border-radius:8px;background:var(--panel);box-shadow:0 3px 10px rgba(0,0,0,.3);font-size:12px;text-align:left;min-width:0;position:relative}
.ticker b{flex:0 0 auto;font-family:"Noto Serif KR",serif;font-weight:900;font-size:11.5px;color:var(--ink);letter-spacing:.02em}
.ticker span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-dim)}
.ticker.hot{background:rgba(160,20,30,.92)}.ticker.hot span{color:#fff}
.ncount{font-style:normal;flex:0 0 auto;background:var(--amber);color:var(--amber-ink);font-weight:800;font-size:10px;border-radius:8px;padding:1px 6px 0}
/* news site: deliberate single "paper" look */
.tcap{display:flex;flex-direction:column;gap:8px}.tcap>div{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}.tcap .meter{grid-column:1/-1}.tcap b{font-family:var(--f-num)}
.rsact{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;background:color-mix(in srgb,var(--glow) 12%,transparent);border:1px solid color-mix(in srgb,var(--glow) 45%,transparent);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.rsact .meter{grid-column:1/-1}.rsact.idle{display:block;background:color-mix(in srgb,var(--ink) 5%,transparent);border-color:color-mix(in srgb,var(--ink) 18%,transparent)}
.rstree{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rsrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start}
.rscat{font-size:12px;font-weight:800;color:var(--amber);padding-top:8px}
.rsnodes{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x}

.rsn b{font-size:12.5px;padding-right:38px}.rsn small{font-size:10.5px;color:var(--ink-dim);line-height:1.35}.rsn small.pre{color:var(--amber);font-family:var(--f-num)}
.rsy{position:absolute;top:7px;right:7px;font-family:var(--f-num);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--ink) 15%,transparent)}.rsy.ahead{background:#a3412f;color:#fff}
.rsn.done{background:color-mix(in srgb,var(--good) 18%,var(--solid))}.rsn.done small.pre{color:var(--good)}
.rsn.cur{border-color:var(--amber)}.rsn.avail{border-color:color-mix(in srgb,var(--ink) 45%,transparent)}.rsn.avail:hover{background:var(--sign-hi)}
.wdep{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:6px;padding:9px 11px 8px;margin-bottom:5px}.wdep>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.wdep b{font-size:13.5px}.wdep small{font-size:10.5px;color:var(--ink-dim)}.wdep .pa-fx{color:var(--ink)}
.wdes{box-shadow:inset 0 0 0 1px var(--line);border-radius:6px;padding:10px 12px 12px;margin-top:8px}.wdes .tabs{margin-bottom:8px}
.wslot{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}.wsn{font-size:12px;font-weight:700;padding-top:8px}
.wopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:5px}.wopts .lopt small{line-height:1.3}.wopts .wpe{font-family:var(--f-num);color:var(--ink)}.wopts .lopt.on .wpe{color:var(--amber-ink)}
.wsum{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}.wsum .kv span:nth-child(even){font-family:var(--f-ui)}.wsum .field{margin:0}
.wstats{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;align-items:center;font-size:11.5px;color:var(--ink-dim)}.wbar2{display:block;height:6px;background:var(--sunk);overflow:hidden}.wbar2 i{display:block;height:100%;background:var(--ink)}

function genMap(seed,type){
  const r=rngFrom(seed);
  const noise=cell=>{const m=Math.ceil(N/cell)+3,g=[];for(let i=0;i<m*m;i++)g.push(r());const v=(i,j)=>g[j*m+i];
    return(x,y)=>{const fx=x/cell,fy=y/cell,x0=Math.floor(fx),y0=Math.floor(fy),tx=fx-x0,ty=fy-y0,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
      const a=v(x0,y0)+(v(x0+1,y0)-v(x0,y0))*sx,b=v(x0,y0+1)+(v(x0+1,y0+1)-v(x0,y0+1))*sx;return a+(b-a)*sy;};};
  const n1=noise(13),n2=noise(5),n3=noise(6),n4=noise(3),ne=noise(9),ne2=noise(4),n8=noise(8);
  const{ter,el,tree,vr}=T;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;vr[i]=(r()*256)|0;
    const h=n1(x,y)*.72+n2(x,y)*.28,e=ne(x,y)*.7+ne2(x,y)*.3;let w=false,hill=0;
    switch(type){
      case'river':w=h<.25;if(e>.74)hill=(e-.74)/.26;break;
      case'coast':{const g=x/N;w=g+(h-.5)*.6>.68;if(w&&h>.76)w=false;if(!w&&e>.78&&g<.55)hill=(e-.78)/.22;break;}
      case'mountain':{const d=Math.hypot(x-N/2,y-N/2)/(N/2);const m=d*.9+e*.5-.32;if(m>.5)hill=(m-.5)/.4;w=h<.2&&d<.55;break;}
      case'islands':w=h<.5;if(!w&&e>.72)hill=(e-.72)/.28;break;
      case'lakes':w=n8(x,y)*.8+n2(x,y)*.2<.32;if(!w&&e>.6)hill=(e-.6)/.4;break;
      case'plain':w=h<.13;break;
    }
    ter[i]=w?1:hill>0?3:0;el[i]=hill>0?clamp(1+Math.floor(hill*4),1,4):0;}
  if(type==='river'){let rx=Math.floor(N*(.6+r()*.2));for(let y=0;y<N;y++){rx+=Math.round((r()-.5)*1.7);rx=clamp(rx,N*.45|0,N-4);for(let k=0;k<2+(r()<.3?1:0);k++){const i=y*N+rx+k;ter[i]=1;el[i]=0;}}}
  if(type==='mountain'){let rx=N/2|0;for(let y=0;y<N*.55;y++){rx+=Math.round((r()-.5)*1.4);const i=y*N+rx;ter[i]=1;el[i]=0;}}
  const hy=(N/2|0)+Math.round((r()-.5)*8);
  // start area & highway corridor
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;const d=Math.hypot(x-14,y-hy);
    if(d<7.5||(Math.abs(y-hy)<=1&&x<16)){if(ter[i]!==0&&ter[i]!==2||d<7.5){if(ter[i]===1&&d>=6.5&&Math.abs(y-hy)>1)continue;ter[i]=0;el[i]=0;}}}
  // sand
  const sandAll=type==='coast'||type==='islands';

    const ox=xx<b.x||xx>=b.x+b.size,oy=yy<b.y||yy>=b.y+b.size;if(ox===oy||!inb(xx,yy))continue;
    const k=yy*N+xx;if(isRoad(k))return T.comp[k];}
  return -1;
}
function nearWater(x,y,s){
  for(let yy=y-1;yy<=y+s;yy++)for(let xx=x-1;xx<=x+s;xx++){const ox=xx<x||xx>=x+s,oy=yy<y||yy>=y+s;if(ox===oy||!inb(xx,yy))continue;if(T.ter[yy*N+xx]===1)return true;}
  return false;
}
function label(arr,pass,list){

    const id=out.length,c={edge:false,n:0};out.push(c);let h=0,t=0;q[t++]=i;arr[i]=id;
    while(h<t){const j=q[h++];c.n++;const x=j%N,y=(j/N)|0;if(x===0||y===0||x===N-1||y===N-1)c.edge=true;
      for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const k=ny*N+nx;if(pass(k)&&arr[k]<0){arr[k]=id;q[t++]=k;}}}}
  return out;
}
function labelRoads(){
  const NN=N*N,arr=new Int32Array(2*NN).fill(-1),q=new Int32Array(2*NN),out=[];roadList=[];hwList=[];
  for(let v=0;v<2*NN;v++){if(!isNode(v))continue;if(v<NN)roadList.push(v);else hwList.push(v);if(arr[v]>=0)continue;
    const id=out.length,c={edge:false,n:0};out.push(c);let h=0,t=0;q[t++]=v;arr[v]=id;
    while(h<t){const u=q[h++];c.n++;const j=u%NN,x=j%N,y=(j/N)|0;if(x===0||y===0||x===N-1||y===N-1)c.edge=true;
      for(const w of roadNb(u))if(arr[w]<0){arr[w]=id;q[t++]=w;}}}

function recomputeNet(){

    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const k=ny*N+nx;if(isRoad(k)){const d=Math.abs(dx)+Math.abs(dy);if(d<bd){bd=d;best=T.comp[k];}}}

function recomputeUtil(){

  const{zone,kind,acc,lvl,pw,wt}=T;pw.fill(0);wt.fill(0);
  for(let i=0;i<N*N;i++){

    if(L===0){pw[i]=P[c]>0?1:0;wt[i]=Wt[c]>0?1:0;continue;}

function addCircle(cx,cy,r,fn){for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){if(!inb(x,y))continue;const d=Math.hypot(x+.5-cx,y+.5-cy);if(d<=r)fn(y*N+x,d);}}

function tripFactor(i){const c=T.cov[i];return c&32?.55:c&16?.75:1;}
function computeEnv(){

      if(!rel){rel=new Float32Array(n).fill(1);}any=true;addCircle(i%N+.5,(i/N|0)+.5,8,(k,d)=>{rel[k]=Math.min(rel[k],.6+.4*d/8);});}
    let saved=0;if(any)for(let i=0;i<n;i++)if(rel[i]<1&&isRoad(i)){saved+=tr[i]*(1-rel[i]);tr[i]*=rel[i];}st.relief=Math.round(saved);}

}

const CLSN=['운항 불가','소형기','중형기','대형기'],RWNEED=[0,6,10,16];
function computeAirports(){

    const seq=[...a];for(let k=a.length-2;k>0;k--)seq.push(a[k]);

}

}

  if(v<NN){const x=v%N,y=(v/N)|0;for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const n=ny*N+nx;if(isRoad(n))o.push(n);if(T.hw[n]>=2&&rampLo(n)===v)o.push(NN+n);}return o;}

      const c=Math.round((T.ter[i]===1?200:120)*(M('cost',{}).elev||1)*(1+FX('roadCost')));

function commit(p){

  if(p.cost>S.money){toast(`자금이 부족해요 (필요 ${money(p.cost)})`,'warn');return;}
  const tl=p.tool;let net=true;
  if(tl==='road'||tl==='avenue'){for(const t of p.tiles){if(!t.ok||t.skip)continue;const i=t.y*N+t.x;T.kind[i]=T.kind[i]===4?5:1;T.rl[i]=tl==='avenue'?2:Math.max(1,T.rl[i]);T.tree[i]=0;T.zone[i]=0;T.lvl[i]=0;}}
  else if(tl==='elev'){for(const t of p.tiles){if(!t.ok||t.skip)continue;const i=t.y*N+t.x;T.hw[i]=1;if(!T.kind[i]){T.tree[i]=0;T.zone[i]=0;T.lvl[i]=0;}}}
  else if(tl==='ramp'){const t=p.tiles[0],i=t.y*N+t.x;T.hw[i]=2+p.rd;T.tree[i]=0;T.zone[i]=0;T.lvl[i]=0;}
  else if(tl==='rail'){for(const t of p.tiles){if(!t.ok||t.skip)continue;const i=t.y*N+t.x;T.kind[i]=T.kind[i]===1?5:4;T.tree[i]=0;T.zone[i]=0;T.lvl[i]=0;}}
  else if(tl==='flatten'||tl==='raise'||tl==='lower'){net=false;for(const t of p.tiles){if(!t.ok)continue;const i=t.y*N+t.x;T.el[i]=t.ne;if(t.ne>0)T.ter[i]=3;else if(T.ter[i]===3)T.ter[i]=0;}portCache.clear();}
  else if(tl==='busstop'){const t=p.tiles[0];T.stop[t.y*N+t.x]=1;}
  else if(tl==='station'){const t=p.tiles[0];T.kind[t.y*N+t.x]=6;}
  else if(tl==='runway'||tl==='taxiway'||tl==='apron'){const code={runway:1,taxiway:2,apron:3}[tl];for(const t of p.tiles){if(!t.ok||t.skip)continue;const i=t.y*N+t.x;T.kind[i]=7;T.ap[i]=code;T.tree[i]=0;T.zone[i]=0;T.lvl[i]=0;}}
  else if(ZT[tl]){net=false;const z=ZT[tl];for(const t of p.tiles){if(!t.ok)continue;const i=t.y*N+t.x;T.zone[i]=z;T.lvl[i]=0;T.tree[i]=0;T.bad[i]=0;}}
  else if(tl==='doze'){
    for(const t of p.tiles){if(!t.ok)continue;const i=t.y*N+t.x,k=T.kind[i];
      if(T.hw[i]){T.hw[i]=0;continue;}
      if(k===3)removeBuilding(T.bid[i]);
      else if(k){T.kind[i]=0;T.stop[i]=0;T.rl[i]=0;T.ap[i]=0;}
      else if(T.zone[i]){T.zone[i]=0;T.lvl[i]=0;}
      else T.tree[i]=0;}
  }else if(DEFS[tl]){
    const d=DEFS[tl],id=S.nextId++,b={id,type:tl,x:p.bx,y:p.by,size:d.size,comp:-1};
    S.buildings[id]=b;
    for(let y=b.y;y<b.y+b.size;y++)for(let x=b.x;x<b.x+b.size;x++){const i=y*N+x;T.kind[i]=3;T.bid[i]=id;T.tree[i]=0;T.zone[i]=0;T.lvl[i]=0;}
  }
  S.money-=p.cost;
  refreshAll(net);hudDirty=true;
  if(DEFS[tl]&&!DEFS[tl].special){const b=S.buildings[S.nextId-1];if(b&&b.comp<0)toast(`${jo(DEFS[tl].name,'이','가')} 도로에 닿지 않았어요`,'warn');else if(DEFS[tl].lm){toast(`${DEFS[tl].name} 완공! 관광객이 찾아와요`);newsOn('landmark',{name:DEFS[tl].name,tour:DEFS[tl].tour});}else if(tl==='nlab')newsOn('nlab');else if(DEFS[tl].port){const pi=portInfo(S.buildings[S.nextId-1]);newsOn('port',{name:DEFS[tl].name,cap:DEFS[tl].port,sea:pi.sea});if(!pi.sea)toast('바다로 이어지지 않는 물이라 용량의 30%만 써요','warn');}}

  if(tl==='ramp')toast(p.lowRoad?'램프 완공! 고가도로와 지상 도로가 이어졌어요':'램프 완공 · 낮은 쪽 끝에 도로를 이어 주세요',p.lowRoad?'':'warn');
  if(tl==='elev'){const hs=new Set(p.tiles.filter(t=>t.ok).map(t=>T.hcomp[t.y*N+t.x]));if(![...hs].some(h=>{for(let i=0;i<N*N;i++)if(T.hw[i]>=2&&T.hcomp[i]===h)return true;return false;}))toast('고가도로는 램프로 지상 도로와 이어야 차가 오르내려요');}
  if(tl==='busstop'){const c=T.comp[p.tiles[0].y*N+p.tiles[0].x];if((stopsByComp[c]||[]).length===1)toast('같은 도로망에 정류장을 하나 더 놓으면 버스가 다녀요');}
}
function removeBuilding(id){const b=S.buildings[id];if(!b)return;if(b.type==='nlab'){S.nuke=0;S.nukeReady=false;}

const P=(x,y)=>[(x-y)*HW,(x+y)*HH];

function roofQuad(x0,y0,x1,y1,h,col){quad(up(P(x0,y0),h),up(P(x1,y0),h),up(P(x1,y1),h),up(P(x0,y1),h),col);}

function relParts(i){const X=NAT[i],n=S.dip.n[i],D=S.dip,P=[];const lb=lab();
  P.push(['기본 관계',18]);

  const ag=Math.round(-n.aggr*22);if(ag)P.push(['상대국의 강경 노선',ag]);
  if(n.emb)P.push(['대사관',8]);if(n.trade)P.push(['무역 협정',6]);if(n.nap)P.push(['불가침 조약',4]);if(n.pact)P.push(['방위 동맹',12]);
  const rp=Math.round((D.rep-50)/4);if(rp)P.push(['국제 평판',rp]);
  if(n.sanc)P.push(['우리의 경제 제재',-30]);
  if(lb)P.push([S.nukeReady?'핵무기 보유':'핵 개발 의혹',X.bloc==='non'?-4:-9]);
  if(D.faction){if(X.bloc===D.faction)P.push(['같은 진영',20+FX('opFaction')]);else if(X.bloc!=='non')P.push(['적대 진영',-20]);}
  for(let j=0;j<NAT.length;j++){if(j===i||!D.n[j].pact)continue;const Y=NAT[j];if(Y.rivals.includes(X.id)||X.rivals.includes(Y.id))P.push([`경쟁국 ${jo(Y.name,'과','와')} 동맹`,-15]);}
  const oa=FX('opAll');if(oa)P.push(['국가 정책·법률',oa]);
  if(X.bloc==='west'&&FX('opWest'))P.push(['자유 무역 정책',FX('opWest')]);

  if(n.war>0)P.push(['교전 상태',-60]);

      else if(n.wscore<-35&&rnd()<.3&&!hasP('peacedemand')){const amt=Math.round(4000+st.pop*3);D.pending.push({type:'peacedemand',i,amt,exp:S.day+30});dlog(`${jo(X.name,'이','가')} 배상금 ${money(amt)}를 요구하며 강화를 압박해요.`,'bad');}

    else if(!n.nap&&n.rel<-45&&n.tension>70&&!D.pending.some(p=>p.i===i)&&rnd()<.3+n.aggr*.2){
      const nukeDemand=lb&&!S.nukeReady&&rnd()<.5;const amt=Math.round(4000+st.pop*2.5+n.power*800);

    else{n.gov=X.gov;dlog(`${X.name}에서 정권이 바뀌었어요. 새 정부는 ${n.aggr<old?'대화를 중시하는':'강경한'} 노선을 예고했어요.`,n.aggr<old?'good':'bad');}n.tension*=.6;}
  else if(r<.3){const rv=X.rivals.length?X.rivals[(rnd()*X.rivals.length)|0]:null;if(!rv)return;const j=NIDX(rv);D.wt=Math.min(100,D.wt+1);

  else if(r<.7){if(n.rel>=15&&!n.trade&&!n.sanc&&!n.war&&!D.pending.some(p=>p.i===ri)&&LAWS.trade.opts[D.laws.trade].e.trade!==-1){D.pending.push({type:'trade',i:ri,exp:S.day+25});dlog(`${jo(X.name,'이','가')} 무역 협정을 제안했어요.`,'good');}}
  else if(r<.8){if(n.rel>=60&&n.emb&&!n.pact&&!n.war&&!focusDone('neutral')&&!D.pending.some(p=>p.i===ri)){D.pending.push({type:'pact',i:ri,exp:S.day+25});dlog(`${jo(X.name,'이','가')} 방위 동맹을 제안했어요.`,'good');}}
  else if(r<.9){let k=0;D.n.forEach((m,j)=>{if(m.emb){addMod(j,'국제 정상회의',3+(hasBld('convention')?2:0),1);k++;}});D.wt=Math.max(0,D.wt-2);dlog(`국제 정상회의가 열렸어요. 수교국 ${k}곳과의 관계가 좋아지고 세계 긴장이 조금 줄었어요.`,'good');}
  else{if(n.aggr>.4&&n.power<10){n.power++;D.wt=Math.min(100,D.wt+1);dlog(`${jo(X.name,'이','가')} 군비를 증강했어요 (군사력 ${n.power}).`,'bad');}}
}
function resolvePending(p,c){
  const D=S.dip,X=NAT[p.i],n=D.n[p.i];
  if(p.type==='ult'){
    if(c==='accept'){if(p.nuke){const b=lab();if(b){removeBuilding(b.id);refreshAll(true);}}else{if(S.money<p.amt){toast('배상금을 낼 돈이 부족해요','warn');return false;}S.money-=p.amt;}
      n.tension=Math.max(0,n.tension-55);addMod(p.i,'요구 수용',12,1);D.rep=Math.max(0,D.rep-6);D.ws=Math.max(0,D.ws-8);dlog(`${X.name}의 요구를 받아들였어요. 위기는 넘겼지만 평판과 전쟁 지지도가 떨어졌어요.`,'');}
    else if(c==='neg'){if(D.pp<30){toast('정치력이 부족해요 (30 필요)','warn');return false;}D.pp-=30;
      if(rnd()<.45+D.rep/200){p.amt=Math.round(p.amt/2);p.exp+=15;p.neg=true;dlog(`${jo(X.name,'과','와')} 협상해 요구를 절반으로 줄였어요.`,'good');return'keep';}
      addMod(p.i,'협상 결렬',-5,1);p.neg=true;dlog(`${jo(X.name,'과','와')}의 협상이 결렬됐어요.`,'bad');return'keep';}
    else{addMod(p.i,'최후통첩 거부',-15,1);n.tension=100;D.rep=Math.min(100,D.rep+2);D.ws=Math.min(100,D.ws+6);dlog(`${X.name}의 최후통첩을 ${c==='expire'?'시한까지 무시했어요':'거부했어요'}.`,'bad');
      if(rnd()<.55+n.aggr*.35)declareWar(p.i,'최후통첩 거부를 이유로');}}
  else if(p.type==='trade'){if(c==='accept'){n.trade=true;n.emb=true;dlog(`${jo(X.name,'과','와')} 무역 협정을 맺었어요.`,'good');}else addMod(p.i,'제안 거절',-3,1);}
  else if(p.type==='pact'){if(c==='accept'){const why=pactBlock(p.i);if(why){toast(why,'warn');return false;}signPact(p.i);}else addMod(p.i,'제안 거절',-5,1);}
  else if(p.type==='aid'){if(c==='accept'){if(S.money<p.amt){toast('자금이 부족해요','warn');return false;}S.money-=p.amt;addMod(p.i,'긴급 원조',20,1.5);n.tension=Math.max(0,n.tension-10);D.rep=Math.min(100,D.rep+2);dlog(`${X.name}에 긴급 원조를 보냈어요.`,'good');}else addMod(p.i,'원조 거절',-8,1);}
  else if(p.type==='support'){const Y=NAT[p.j];if(c==='accept'){addMod(p.i,'분쟁 지지',15,1);addMod(p.j,'적대적 개입',-25,1);D.n[p.j].tension=Math.min(100,D.n[p.j].tension+15);dlog(`${jo(X.name,'을','를')} 지지하는 성명을 냈어요. ${jo(Y.name,'이','가')} 반발했어요.`,'');}else{addMod(p.i,'지지 요청 외면',-10,1);}}
  else if(p.type==='mediate'){if(c==='accept'){if(D.pp<40){toast('정치력이 부족해요 (40 필요)','warn');return false;}D.pp-=40;D.rep=Math.min(100,D.rep+3);D.wt=Math.max(0,D.wt-3);addMod(p.i,'위기 중재 협력',10,.5);dlog('벨로르와 함께 칼라드 위기 비밀 중재에 참여했어요.','good');}else dlog('벨로르의 중재 참여 요청을 거절했어요.','');}
  else if(p.type==='peaceoffer'){if(c==='accept')endWar(p.i,'win',p.amt);}
  else if(p.type==='peacedemand'){if(c==='accept'){if(S.money<p.amt){toast('배상금이 부족해요','warn');return false;}endWar(p.i,'lose',p.amt);}else{D.ws=Math.min(100,D.ws+3);D.stab=Math.max(0,D.stab-3);}}
  else if(p.type==='whitepeace'){if(c==='accept')endWar(p.i,'white');}
  try{if(p.type==='ult')newsOn('ult',{i:p.i,c,amt:p.amt,nuke:p.nuke,war:n.war>0});
    else if(p.type==='support'){if(p.src)S.news.flags[p.src]=c;newsOn('support',{i:p.i,c,src:p.src});}
    else if(p.type==='aid'&&p.src==='famine'){S.news.flags.famine=c;newsOn('famine',{i:p.i,c,amt:p.amt});}
    else if(p.type==='mediate'){S.news.flags.mediate=c;newsOn('mediate',{i:p.i,c});}}catch(e){}
  return true;
}

function doAct(i,id){
  const X=NAT[i],n=S.dip.n[i],D=S.dip;const a=actsFor(i).find(q=>q.id===id);if(!a||!a.ok){if(a)toast(a.why,'warn');return;}
  D.pp-=a.pp;S.money-=a.cost;if(id!=='declare'&&id!=='strike')n.acted=monthIdx();
  const rivals=()=>NAT.map((Y,j)=>j).filter(j=>NAT[j].rivals.includes(X.id)||X.rivals.includes(NAT[j].id));
  switch(id){
    case'emb':n.emb=true;addMod(i,'대사관 개설 환영',5,1);dlog(`${X.name}에 대사관을 열었어요.`,'good');break;
    case'aid':addMod(i,'경제 원조',15/(1+n.aid*.5),1.5);n.aid++;n.tension=Math.max(0,n.tension-5);D.rep=Math.min(100,D.rep+1);dlog(`${X.name}에 경제 원조를 보냈어요.`,'good');break;
    case'summit':if(rnd()<summitP(i)){addMod(i,'정상회담 성과',15,1);n.tension=Math.max(0,n.tension-15);D.rep=Math.min(100,D.rep+2);dlog(`${jo(X.name,'과','와')}의 정상회담이 성공했어요.`,'good');toast('정상회담 성공');}else{addMod(i,'정상회담 결렬',-5,1);dlog(`${jo(X.name,'과','와')}의 정상회담이 성과 없이 끝났어요.`,'bad');toast('정상회담 결렬','warn');}break;
    case'trade':n.trade=true;dlog(`${jo(X.name,'과','와')} 무역 협정을 맺었어요.`,'good');break;
    case'xtrade':n.trade=false;addMod(i,'협정 파기',-25,1);D.rep-=10;dlog(`${jo(X.name,'과','와')}의 무역 협정을 파기했어요.`,'bad');break;
    case'nap':n.nap=true;n.tension=Math.max(0,n.tension-20);dlog(`${jo(X.name,'과','와')} 불가침 조약을 맺었어요.`,'good');break;
    case'xnap':n.nap=false;addMod(i,'조약 파기',-30,1);n.tension=Math.min(100,n.tension+30);D.rep-=12;dlog(`${jo(X.name,'과','와')}의 불가침 조약을 파기했어요.`,'bad');break;
    case'pact':signPact(i);break;
    case'xpact':n.pact=false;addMod(i,'동맹 배신',-40,1);D.rep-=15;dlog(`${jo(X.name,'과','와')}의 방위 동맹을 파기했어요.`,'bad');newsOn('xpact',{i});break;
    case'joinf':{const f=Object.keys(FACTION).find(k=>FACTION[k].leader===X.id);if(rnd()<clamp((n.rel-40)/40,.2,.95)){joinFaction(f);}else{addMod(i,'가입 거절',-3,1);dlog(`${FACTION[f].name} 가입 요청이 거절됐어요.`,'bad');toast('진영 가입 거절','warn');}break;}
    case'denounce':addMod(i,'규탄 성명',-20,1);n.tension=Math.min(100,n.tension+10);D.rep-=1;for(const j of rivals())addMod(j,'공동의 적 규탄',8,1);dlog(`${jo(X.name,'을','를')} 규탄하는 성명을 냈어요.`,'');break;
    case'sanc':n.sanc=true;n.trade=false;n.tension=Math.min(100,n.tension+15);NAT.forEach((Y,j)=>{if(j!==i&&Y.bloc===X.bloc&&X.bloc!=='non')addMod(j,'우방 제재 반발',-5,.5);});for(const j of rivals())addMod(j,'제재 동참 환영',5,.5);dlog(`${X.name}에 경제 제재를 부과했어요.`,'');newsOn('sanc',{i});break;
    case'xsanc':n.sanc=false;addMod(i,'제재 해제',8,1);dlog(`${X.name}에 대한 제재를 해제했어요.`,'good');break;
    case'justify':D.just={i,days:60};addMod(i,'전쟁 목표 정당화',-30,.5);D.wt=Math.min(100,D.wt+2);dlog(`${X.name}에 대한 전쟁 목표 정당화를 시작했어요.`,'bad');break;
    case'declare':declareOurWar(i);break;
    case'strike':doStrike(i);break;
    case'peace':endWar(i,'win',X.econ*3000);break;
    case'cease':if(rnd()<ceaseP(i)){endWar(i,'white');toast('휴전 합의');}else{addMod(i,'휴전 협상 실패',-3,1);dlog(`${jo(X.name,'과','와')}의 휴전 협상이 실패했어요.`,'bad');toast('휴전 협상 실패','warn');}break;
  }
  D.rep=clamp(D.rep,0,100);hudDirty=true;dipBadge();
}

/* daily tick */
function initNews(silent){S.news={pub:[],oil:100,hist:[],seen:S.day,flags:{},rc:0};if(silent)for(const a of SCEN)if(a.at<S.day)S.news.pub.push({id:a.id,v:0,d:a.at});}
function art(p){if(p.c)return{...p.c,d:p.d,key:p.id,kind:'react'};const a=SCN_BY[p.id];if(!a)return null;const v=p.v&&a.alt?{...a,...a.alt}:a;return{...v,body:[...v.body,...(p.x?[p.x]:[]),...(p.g||[])],d:p.d,key:p.id,kind:'scen'};}
function newsTick(){
  if(!S.news||!S.dip||S.setup)return;if(!S.news.flags)S.news.flags={};if(!S.mkt)initMkt();let n=0;
  for(const a of SCEN){if(a.at>S.day||S.news.pub.some(p=>p.id===a.id))continue;
    const v=a.cond&&!a.cond()?1:0;const V=v&&a.alt?a.alt:a;const w0=S.dip.wt,o0=S.news.oil;
    try{V.fx&&V.fx();}catch(e){}
    let x='';try{x=a.x?a.x(v):'';}catch(e){x='';}
    const dw=S.dip.wt-w0,eff={...(SHOCK[a.id+(v?'*':'')]||SHOCK[a.id]||{})};
    const est={...eff};est.home=(est.home||0)-dw*.003;est.world=(est.world||0)-dw*.004;est.def=(est.def||0)+dw*.004;if(S.news.oil!==o0)est.energy=(est.energy||0)+(S.news.oil-o0)/o0;
    mktShock(eff,V.h);
    const tone=dw<0?1:dw>0?-1:0,g=[];
    try{g.push(reactPara(a.nat,tone));g.push(mktPara(est));g.push(expertPara(a.cat));g.push(outlookPara(a.cat));}catch(e){}
    S.news.pub.push({id:a.id,v,d:S.day,x:x||undefined,g:g.filter(Boolean)});
    if(V.h.startsWith('[속보]')&&n<2){toast(V.h.replace('[속보] ','속보 · '),'warn');n++;}}
  if(S.day%30===0){S.news.hist.push({d:S.day,wt:Math.round(S.dip.wt),oil:Math.round(S.news.oil),rep:Math.round(S.dip.rep),tr:tradeCount()});if(S.news.hist.length>36)S.news.hist.shift();S.news.oil+=(100-S.news.oil)*.05;}
  updateTicker();
}
function updateTicker(){const el=$('#tickTxt');if(!el||!S.news)return;const L=S.news.pub[S.news.pub.length-1];const a=L?art(L):null;
  el.textContent=a?a.h.replace('[속보] ',''):'국제 뉴스가 여기에 올라온다';
  const unread=S.news.pub.filter(p=>p.d>S.news.seen).length;const d=$('#newsDot');if(d){d.hidden=!unread;d.textContent=unread>9?'9+':unread;}
  $('#ticker').classList.toggle('hot',!!(a&&a.h.startsWith('[속보]')&&S.day-L.d<20));}
function toDa(t){
  t=t.replace(/이에요/g,'이다').replace(/예요/g,'다');
  for(const[k,v]of[['해요','한다'],['돼요','된다'],['져요','진다'],['와요','온다'],['봐요','본다'],['줘요','준다'],['가요','간다'],['줄어요','준다'],['늘어요','는다']])t=t.split(k).join(v);
  return t.replace(/([가-힣])어요/g,(m,c)=>{const j=(c.charCodeAt(0)-0xAC00)%28;return j===20||c==='없'?c+'다':m;});}

let newsView={cat:'전체',id:null};
function allNews(){
  const out=S.news.pub.map(p=>art(p)).filter(Boolean);
  const W=['쿠데타','정권','분쟁','경제 위기','미사일을 시험','정상회의','군비'];
  for(const l of (S.dip?S.dip.log:[])){if(l.nr||l.t.startsWith('[월드 와이어]'))continue;const intl=W.some(w=>l.t.includes(w))&&!l.t.includes('우리');out.push({key:'log'+l.d+'_'+l.t.length+'_'+l.t.charCodeAt(1),kind:'brief',cat:intl?'국제':'우리 도시',h:toDa(l.t.replace(/^\[[^\]]+\]\s*/,'')),d:l.d,tone:l.k,nat:[]});}
  out.sort((a,b)=>b.d-a.d||(a.kind!=='brief'?-1:1));return out;}
const isBr=a=>a.h&&a.h.startsWith('[속보]');
function thumb(a,big){const[c1,c2]=CATC[a.cat]||CATC['국제'];const fl=(a.nat||[]).slice(0,3).map(id=>{const X=NAT[NIDX(id)];return X?`<span class="nfl" style="${flagCss(X)}"></span>`:'';}).join('');
  return`<div class="nth${big?' big':''}" style="background:linear-gradient(135deg,${c1},${c2})"><svg viewBox="0 0 48 48" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${CATI[a.cat]||CATI['국제']}</svg><div class="nfls">${fl}</div>${isBr(a)?'<span class="nbr">속보</span>':''}</div>`;}
function spark(arr,col){if(arr.length<2)return'<svg class="nsp" viewBox="0 0 100 28"></svg>';const mn=Math.min(...arr),mx=Math.max(...arr),r=mx-mn||1;const pts=arr.map((v,i)=>`${(i/(arr.length-1)*96+2).toFixed(1)},${(25-(v-mn)/r*22).toFixed(1)}`).join(' ');const last=pts.split(' ').pop().split(',');
  return`<svg class="nsp" viewBox="0 0 100 28"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${col}"/></svg>`;}
function byline(a){let h=0;for(const ch of (a.key||''))h=(h*31+ch.charCodeAt(0))%997;return REPORTERS[h%REPORTERS.length];}
function openNews(){S.news.seen=S.day;updateTicker();const el=$('#news');el.hidden=false;renderNews();}
function closeNews(){$('#news').hidden=true;}
function renderNews(){
  const el=$('#news'),list=allNews(),D=S.dip;const sel=newsView.id?list.find(a=>a.key===newsView.id):null;
  const full=list.filter(a=>a.kind!=='brief');
  const brs=full.filter(isBr).slice(0,3);

  const side=idx+`<div class="nbox"><h4>많이 본 뉴스</h4><ol class="npop">${pop||'<li>아직 기사가 없다</li>'}</ol></div>`+(mine?`<div class="nbox"><h4>${S.name} 정부 동정</h4><ul class="nmine">${mine}</ul></div>`:'')+(next?`<div class="nbox"><h4>주간 전망</h4><p class="nsm">외교가에서는 ${dateStr(next.at)} 무렵 <b>${next.cat}</b> 분야에서 큰 움직임이 있을 것이라는 관측이 나온다.</p></div>`:'');

      <div class="nby">${sel.kind!=='brief'?`${byline(sel)} 기자 · `:'월드 와이어 단신 · '}${dateStr(sel.d)}</div>${sel.kind!=='brief'?thumb(sel,true):''}
      ${(sel.body||[]).map(p=>`<p>${p}</p>`).join('')||`<p>${sel.h}</p>`}

  }

  el.querySelector('#nclose').onclick=closeNews;
  el.querySelector('#nback')?.addEventListener('click',()=>{newsView.id=null;renderNews();el.scrollTop=0;});

    if(d.port){const pi=portInfo(b);const c=d.port*(pi.sea?1:.3);sea+=c;seaRaw+=d.port;ports.push({name:d.name,sea:pi.sea,cap:c});}
    if(d.acap&&b.acomp>=0&&airports[b.acomp]&&airports[b.acomp].valid)air+=d.acap;}

  const oil=S.news?S.news.oil:100;

  const rem={...cap},used={road:0,sea:0,air:0},out={};let inc=0,vol=0;

    out[g].exp=Math.round(out[g].exp);}

function ensureRS(){if(!S.rs)S.rs={done:[],act:[]};}
const tDone=id=>!!(S.rs&&S.rs.done.includes(id));
function RT(k){if(!S||!S.rs)return 0;let v=0;for(const id of S.rs.done){const e=TBY[id]&&TBY[id].e;if(e&&e[k])v+=e[k];}if(S.rs.wpn)for(const w of S.rs.wpn)if(w.e[k])v+=w.e[k];return v;}
let rsSel=null;
const rsSlots=()=>Math.min(4,cntBld('dlab')+(cntBld('dlab')&&cntBld('univ')?1:0));
const rsBonus=()=>Math.min(.6,cntBld('univ')*.15+(S.leader==='defense'?.15:0)+(focusDone('deter')?.1:0)+(S.dip&&S.dip.laws.econ>=2?.1:0));
const curYear=()=>2026+Math.floor(S.day/360);
const aheadMul=t=>1+Math.max(0,t.y-curYear())*.8;
function techState(t){if(tDone(t.id))return'done';if(S.rs.act.some(a=>a.id===t.id))return'cur';if(t.excl&&t.excl.some(tDone))return'excl';if(t.req&&!t.req.every(tDone))return'lock';return'avail';}
function startTech(id){const t=TBY[id];ensureRS();if(!rsSlots()){toast('국방과학연구소를 먼저 지어야 해요','warn');return;}
  if(S.rs.act.length>=rsSlots()){toast('연구 슬롯이 가득 찼어요. 연구소를 더 짓거나 진행 중인 연구가 끝나길 기다리세요','warn');return;}
  if(techState(t)!=='avail')return;if(S.money<t.cost){toast(`연구비 ${money(t.cost)}가 부족해요`,'warn');return;}
  S.money-=t.cost;S.rs.act.push({id,p:0,need:Math.round(t.days*aheadMul(t))});dlog(`국방 연구 「${t.name}」을 시작했어요.`,'');hudDirty=true;}
function cancelTech(id){const k=S.rs.act.findIndex(a=>a.id===id);if(k>=0){S.rs.act.splice(k,1);toast('연구를 중단했어요 (연구비는 돌려받지 못해요)','warn');}}
function researchDaily(){wdDaily();if(!S.rs||!S.rs.act.length)return;if(!rsSlots())return;const sp=1+rsBonus();
  for(const a of [...S.rs.act]){a.p+=sp;if(a.p>=a.need){S.rs.act.splice(S.rs.act.indexOf(a),1);S.rs.done.push(a.id);const t=TBY[a.id];
    if(a.id==='ms4b'&&S.dip)S.dip.wt=Math.min(100,S.dip.wt+5);

function migrateSave(o){const S2=o.S;if(!S2)return o;
  const REN={park:'park1',police:'police1',fire:'fire1',school:'school1'};
  for(const id in (S2.buildings||{})){const b=S2.buildings[id];if(!DEFS[b.type]&&REN[b.type])b.type=REN[b.type];if(!DEFS[b.type]){delete S2.buildings[id];b.dead=1;}}
  S2.name=S2.name||'그리드시티';S2.type=S2.type||'river';S2.diff=S2.diff||'normal';S2.leader=S2.leader||'dev';S2.tax=S2.tax||9;S2.hist=S2.hist||[S2.money||0];S2.dem=S2.dem||[0,.5,.5,.5];S2.tier=S2.tier||0;S2.peak=S2.peak||0;S2.setup=false;
  if(S2.speed==null)S2.speed=1;return o;}

function blobPts(cx,cy,r,seed){const rr=rngFrom(seed);const ph=[rr()*6,rr()*6,rr()*6],n=24,pts=[];

/* ---------- render ---------- */
let preview=null;
function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);hm('g');monoHold++;ctx.fillStyle=GROUND;monoHold--;ctx.fillRect(0,0,W,H);
  if(!T)return;
  const z=cam.z;ctx.setTransform(z*DPR,0,0,z*DPR,(W/2-cam.x*z)*DPR,(H/2-cam.y*z)*DPR);
  const vx0=cam.x-W/2/z-HW*2,vx1=cam.x+W/2/z+HW*2,vy0=cam.y-H/2/z-HH*2,vy1=cam.y+H/2/z+300;
  const a=P(0,N),b=P(N,N),c=P(N,0);
  quad(a,b,[b[0],b[1]+16],[a[0],a[1]+16],'#5d4a35');quad(b,c,[c[0],c[1]+16],[b[0],b[1]+16],'#4a3b2b');
  const vis=(x,y)=>{const cx=(x-y)*HW,cy=(x+y+1)*HH;return cx>vx0&&cx<vx1&&cy>vy0&&cy<vy1;};
  // vehicle buckets
  const bk=new Map();const push=(tile,it)=>{if(T.ter[tile]===1)it.y-=BH;let arr=bk.get(tile);if(!arr)bk.set(tile,arr=[]);arr.push(it);};
  for(const cc of cars){const p=pt(cc.cur,cc.next,cc.t);push(p.tile,{x:p.x-p.dy*4.2,y:p.y+p.dx*4.2,dx:p.dx,dy:p.dy,l:8,w:4,c:cc.taxi?'#f2a63a':cc.c,r:cc.taxi?'#f6e27a':null});}
  for(const bb of buses){const p=along(bb,0);push(p.tile,{x:p.x-p.dy*4.4,y:p.y+p.dx*4.4,dx:p.dx,dy:p.dy,l:13,w:4.6,c:bb.col,s:'#f2f2ee'});}
  for(const pl of planes){if(pl.st==='away'||pl.alt>=4)continue;const tx=clamp(Math.floor(pl.x),0,N-1),ty=clamp(Math.floor(pl.y),0,N-1);let arr=bk.get(ty*N+tx);if(!arr)bk.set(ty*N+tx,arr=[]);arr.push({plane:pl});}
  for(const sp of ships){const o=shipPos(sp);let arr=bk.get(o.tile);if(!arr)bk.set(o.tile,arr=[]);arr.push({ship:sp,o});}
  for(const tr of trains){for(let k=0;k<tr.len;k++){const p=along(tr,k*.62);push(p.tile,{x:p.x,y:p.y,dx:p.dx,dy:p.dy,l:17,w:5.4,c:'#eef0ee',s:tr.col,tr:1});}}
  const grid=tool!=='pan'&&z>.5,dim=overlay!=='none';
  const prevMap=new Map();if(preview)for(const p of preview.tiles){if(p.skip&&!(preview.tool==='road'||preview.tool==='rail'))continue;prevMap.set(p.y*N+p.x,p.ok);}
  for(let s=0;s<=2*N-2;s++){for(let x=Math.max(0,s-N+1);x<=Math.min(N-1,s);x++){const y=s-x;if(!vis(x,y))continue;const i=y*N+x,k=T.kind[i];
    drawGround(x,y,i,t);
    hm('g');if(z>.45&&T.ter[i]!==3){monoHold++;ctx.strokeStyle=grid?'rgba(140,200,255,.16)':'rgba(120,180,255,.05)';monoHold--;ctx.lineWidth=1/z;const q=[P(x,y),P(x+1,y),P(x+1,y+1)];ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);ctx.lineTo(q[1][0],q[1][1]);ctx.lineTo(q[2][0],q[2][1]);ctx.stroke();}
    const lf=T.ter[i]===3?T.el[i]*ELH:0;
    if(dim){const col=overlayColor(x,y,i);if(col){monoHold++;dia(x,y,0,col,lf);monoHold--;}}
    if(prevMap.has(i)){const ok=prevMap.get(i);monoHold++;dia(x,y,0,ok?(preview.tool==='doze'?'rgba(239,106,92,.45)':'rgba(140,240,160,.42)'):'rgba(240,80,70,.35)',T.ter[i]===3?T.el[i]*ELH:0);monoHold--;}
    if(dim)ctx.globalAlpha=.55;
    hm('b');curLift=lf;if(lf){ctx.save();ctx.translate(0,-lf);}
    if(k===1||k===5){if(T.ter[i]===1){ctx.save();ctx.translate(0,-BH);drawRoadObj(x,y,i);ctx.restore();}else drawRoadObj(x,y,i);}
    else if(k===6){if(T.ter[i]===1){ctx.save();ctx.translate(0,-BH);drawStationObj(x,y,i);ctx.restore();}else drawStationObj(x,y,i);}
    else if(k===3){const bd=S.buildings[T.bid[i]];if(bd&&x===bd.x+bd.size-1&&y===bd.y+bd.size-1)drawService(bd,t);}
    else if(T.zone[i]&&T.lvl[i]>0)drawZoneBld(x,y,i,t);
    const arr=bk.get(i);if(arr)drawVeh(arr);
    if(lf){ctx.restore();}curLift=0;
    if(T.hw[i]){hm('r');drawDeck(x,y,i);hm('b');if(prevMap.has(i)&&preview.tool==='elev')keepCol(()=>dia(x,y,0,prevMap.get(i)?'rgba(140,240,160,.42)':'rgba(240,80,70,.35)',DECKH));const ha=bk.get(N*N+i);if(ha)drawVeh(ha);}
    else if(prevMap.has(i)&&preview.tool==='elev')keepCol(()=>dia(x,y,0,prevMap.get(i)?'rgba(140,240,160,.42)':'rgba(240,80,70,.35)',DECKH));
    if(dim)ctx.globalAlpha=1;
  }}
  hm('b');
  for(const p of parts){const al=(1-p.l/p.m)*.55;ctx.fillStyle=`rgba(228,226,220,${al})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();}
  hm('g');keepCol(()=>drawTutMark(t));hm('b');
  drawPlanes(t);
  for(const j of jets)if(j.t>=0)drawPlane(j,t);
  hm('g');keepCol(()=>drawRaid(t));
  if(preview&&DEFS[preview.tool]&&!DEFS[preview.tool].special&&preview.any){const gs=DEFS[preview.tool].size,gl=elv((preview.by+gs-1)*N+preview.bx+gs-1)*ELH;ctx.globalAlpha=.8;ctx.save();ctx.translate(0,-gl);hm('b');drawService({type:preview.tool,x:preview.bx,y:preview.by,size:gs,comp:0},t);ctx.restore();hm('g');ctx.globalAlpha=1;
    const d=DEFS[preview.tool];if(d.radius){const cx=preview.bx+d.size/2,cy=preview.by+d.size/2,cc=P(cx,cy);monoHold++;ctx.strokeStyle='rgba(190,230,255,.85)';monoHold--;ctx.lineWidth=1.5/z;ctx.setLineDash([6/z,5/z]);ctx.beginPath();ctx.ellipse(cc[0],cc[1],d.radius*HW*1.414,d.radius*HH*1.414,0,0,7);ctx.stroke();ctx.setLineDash([]);}}
  if(selTile){const{x,y}=selTile;ctx.save();ctx.translate(0,-elv(y*N+x)*ELH);monoHold++;ctx.strokeStyle='#ffffff';monoHold--;ctx.lineWidth=2.5/z;const q=[P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)];ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);q.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.stroke();ctx.restore();}
  hm('g');bloomPass();
}
function drawVeh(arr){
  for(const v of arr){if(v.ship){drawShip(v.ship,v.o);continue;}if(v.plane){drawPlane(v.plane,performance.now()/1000);continue;}ctx.save();ctx.translate(v.x,v.y);ctx.rotate(Math.atan2(v.dy,v.dx));
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-v.l/2,-v.w/2+1.4,v.l,v.w);
    ctx.fillStyle=v.c;ctx.fillRect(-v.l/2,-v.w/2-1,v.l,v.w);
    if(v.s){ctx.fillStyle=v.s;ctx.fillRect(-v.l/2,v.w/2-2.4,v.l,1.4);if(v.tr){ctx.fillStyle='rgba(40,60,80,.55)';for(let k=-v.l/2+2;k<v.l/2-2;k+=4)ctx.fillRect(k,-v.w/2,2.4,1.6);}}
    else{ctx.fillStyle=v.r||'rgba(255,255,255,.35)';ctx.fillRect(-1.5,-v.w/2-.5,3,v.w-1);}

/* ---------- camera & input ---------- */
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
window.addEventListener('resize',resize);resize();
function clampCam(){cam.x=clamp(cam.x,-N*HW,N*HW);cam.y=clamp(cam.y,0,N*TH);cam.z=clamp(cam.z,.35,2.6);}
function s2w(sx,sy){return{x:cam.x+(sx-W/2)/cam.z,y:cam.y+(sy-H/2)/cam.z};}
function tileAt(sx,sy,clampIt){const w=s2w(sx,sy);
  if(T)for(let d=4;d>=1;d--){const wy=w.y+d*ELH;const cx=Math.floor((wy/HH+w.x/HW)/2),cy=Math.floor((wy/HH-w.x/HW)/2);if(inb(cx,cy)&&elv(cy*N+cx)===d)return{x:cx,y:cy};}
  let x=Math.floor((w.y/HH+w.x/HW)/2),y=Math.floor((w.y/HH-w.x/HW)/2);
  if(!inb(x,y)){if(!clampIt)return null;x=clamp(x,0,N-1);y=clamp(y,0,N-1);}return{x,y};}

const ptrs=new Map();let mode=null,dragA=null,dragB=null,panStart=null,pinch=null,downAt=null,selTile=null,hover=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){mode='pinch';preview=null;dragA=null;const[p,q]=[...ptrs.values()];const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;pinch={d:Math.hypot(p.x-q.x,p.y-q.y),z:cam.z,w:s2w(mx,my)};return;}
  if(ptrs.size>2)return;
  downAt={x:e.clientX,y:e.clientY};
  if(e.button===1||e.button===2||tool==='pan'){mode='pan';panStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};}
  else{mode='build';dragA=tileAt(e.clientX,e.clientY,false);dragB=dragA;if(!dragA){mode='pan';panStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};}else preview=makePlan(tool,dragA,dragB);updateToolInfo();}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)){if(e.pointerType==='mouse'&&tool!=='pan'){const tt=tileAt(e.clientX,e.clientY,false);if(tt&&(!hover||tt.x!==hover.x||tt.y!==hover.y)){hover=tt;preview=makePlan(tool,tt,tt);updateToolInfo();}else if(!tt){hover=null;preview=null;}}return;}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode==='pinch'&&ptrs.size>=2){const[p,q]=[...ptrs.values()];const d=Math.hypot(p.x-q.x,p.y-q.y),mx=(p.x+q.x)/2,my=(p.y+q.y)/2;cam.z=clamp(pinch.z*d/pinch.d,.35,2.6);cam.x=pinch.w.x-(mx-W/2)/cam.z;cam.y=pinch.w.y-(my-H/2)/cam.z;clampCam();}
  else if(mode==='pan'&&panStart){cam.x=panStart.cx-(e.clientX-panStart.x)/cam.z;cam.y=panStart.cy-(e.clientY-panStart.y)/cam.z;clampCam();}
  else if(mode==='build'){const tt=tileAt(e.clientX,e.clientY,true);if(tt&&(tt.x!==dragB.x||tt.y!==dragB.y)){dragB=tt;preview=makePlan(tool,dragA,dragB);updateToolInfo();}}
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(mode==='pinch'){if(ptrs.size===0)mode=null;else{const p=[...ptrs.values()][0];mode='pan';panStart={x:p.x,y:p.y,cx:cam.x,cy:cam.y};}return;}
  if(e.type==='pointercancel'){mode=null;preview=null;return;}
  if(mode==='build'){commit(preview);preview=e.pointerType==='mouse'?makePlan(tool,dragB,dragB):null;dragA=null;updateToolInfo();}
  else if(mode==='pan'&&downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)<7&&e.button===0){const tt=tileAt(e.clientX,e.clientY,false);if(tt)inspect(tt);else closeCard();}
  mode=null;panStart=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!ptrs.size){hover=null;preview=null;}});
cv.addEventListener('wheel',e=>{e.preventDefault();const w=s2w(e.clientX,e.clientY);cam.z=clamp(cam.z*Math.exp(-e.deltaY*.0015),.35,2.6);cam.x=w.x-(e.clientX-W/2)/cam.z;cam.y=w.y-(e.clientY-H/2)/cam.z;clampCam();},{passive:false});
const keys=new Set();
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();if(!S.setup)setSpeed(S.speed?0:1);}
  else if(e.key==='Escape'){if(!$('#news').hidden){closeNews();return;}if(!$('#worldmap').hidden){closeWorld();return;}if(!$('#pension').hidden){closePen();return;}pickCat('pan');closeCard();}
  else if(/^[1-9]$/.test(e.key)){const ids=CATS.filter(c=>c!=='sep').map(c=>c.id);const id=ids[+e.key];if(id)pickCat(id);}
  else if(e.key==='0')pickCat('doze');
  else keys.add(e.key.toLowerCase());});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));

function toast(msg,kind){for(const t of document.querySelectorAll('#toasts .toast'))if(t.textContent===msg&&!t.classList.contains('out'))return;const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;const box=$('#toasts');box.appendChild(el);while(box.children.length>3)box.firstChild.remove();setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),450);},3200);}
function buildTools(){
  const wrap=$('#tools');wrap.innerHTML='';
  for(const c of CATS){
    if(c==='sep'){const s=document.createElement('div');s.className='sep';wrap.appendChild(s);continue;}
    const b=document.createElement('button');b.className='tool'+(c.id===curCat?' on':'');b.id='cat-'+c.id;
    b.innerHTML=`<svg viewBox="0 0 24 24">${IC[c.ic]}</svg><span class="tn">${c.name}</span>${c.chip?`<i class="chip" style="background:${c.chip}"></i>`:''}${c.opts.length>1?'<span class="more">▲</span>':''}`;
    b.addEventListener('click',()=>pickCat(c.id));wrap.appendChild(b);
  }
}
const locked=id=>{const d=tdef(id);return!!(d.unlock&&S.peak<d.unlock);};
function pickCat(id){
  const c=CATS.find(x=>x!=='sep'&&x.id===id);if(!c)return;
  curCat=id;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.id==='cat-'+id));

}
function renderSub(){
  const c=CATS.find(x=>x!=='sep'&&x.id===curCat);const el=$('#subtools');

  el.hidden=false;el.innerHTML='';
  for(const o of c.opts){const d=tdef(o),lk=locked(o);const b=document.createElement('button');b.className='opt-card'+(o===tool?' on':'')+(lk?' locked':'');b.id='opt-'+o;
    const stat=d.stat||RAD_TIP(d)||(d.special==='stop'?'반경 5칸':d.special==='station'?'반경 9칸':d.special==='rail'?'타일당':'');

    b.addEventListener('click',()=>{if(lk){toast(`인구 ${fmt(d.unlock)}명이 되면 지을 수 있어요`,'warn');return;}catSel[curCat]=o;selectTool(o);});el.appendChild(b);}

    issue=T.hw[i]>=2?((()=>{const lo=rampLo(i);return lo>=0&&!isRoad(lo)?'램프 낮은 쪽 끝에 지상 도로를 이어야 차가 오르내려요.':'';})()):!nR?'램프가 없어서 지상 도로와 이어지지 않아요. 고가 옆 빈 칸에 램프를 놓으세요.':'';}
  const el=$('#card');el.innerHTML=head(title,sub)+(rows.length?`<div class="kv">${rows.map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('')}</div>`:'')+(issue?`<div class="issue">${issue}</div>`:'');
  el.hidden=false;el.querySelector('.x').addEventListener('click',closeCard);
}

/* ---------- save / load ---------- */
const B64=a=>{let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);};
const UB64=(s,a)=>{const t=atob(s);for(let i=0;i<t.length&&i<a.length;i++)a[i]=t.charCodeAt(i);};
const SAVED=['ter','el','tree','zone','lvl','kind','vr','bad','rl','stop','wn','ap','hw'];
function serialize(){const a={};SAVED.forEach(k=>a[k]=B64(T[k]));return{N,S,a,bid:Array.from(T.bid),cam:{...cam}};}
function load(o){endRaidQuiet();T=alloc();const on=o.N||50;
  if(on===N){SAVED.forEach(k=>{if(o.a[k])UB64(o.a[k],T[k]);});o.bid.forEach((v,i)=>T.bid[i]=v);S=o.S;if(o.cam)Object.assign(cam,o.cam);}
  else{S=o.S;const oy=Math.floor((N-on)/2);genMap(S.seed,S.type||'river');
    for(let x=0;x<16;x++)for(let y=0;y<N;y++){const i=y*N+x;if(T.kind[i]===1){T.kind[i]=0;T.rl[i]=0;}}
    const tmp={};SAVED.forEach(k=>{tmp[k]=new Uint8Array(on*on);if(o.a[k])UB64(o.a[k],tmp[k]);});
    for(let y=0;y<on;y++)for(let x=0;x<on;x++){const si=y*on+x,di=(y+oy)*N+x;SAVED.forEach(k=>{T[k][di]=tmp[k][si];});T.bid[di]=o.bid[si]||0;}
    for(const id in S.buildings)S.buildings[id].y+=oy;S.hy=(S.hy||0)+oy;cam.x=(14-S.hy)*HW;cam.y=(14+S.hy)*HH;
    setTimeout(()=>toast(`맵이 ${N}×${N}으로 넓어졌어요. 기존 도시는 그대로 옮겨졌어요`),800);}
  ensureDip();ensureRS();if(!S.news)initNews(true);if(!S.news.flags)S.news.flags={};cars=[];parts=[];refreshAll(true);}
const SAVEFMT='gridcity-save';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function saveFileName(){const nm=String(S.name||'그리드시티').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40)||'gridcity';const d=new Date(),p=n=>String(n).padStart(2,'0');return`${nm}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`;}
async function exportSave(){
  if(S.setup){toast('도시를 시작한 뒤에 저장할 수 있어요','warn');return;}
  save();const data=JSON.stringify({format:SAVEFMT,version:1,savedAt:new Date().toISOString(),city:S.name,pop:st.pop,day:S.day,save:serialize()});const fn=saveFileName();
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(e){dl=null;}
  if(dl){try{await dl.save({filename:fn,data});toast('저장 파일을 기기에 내려받았어요');}catch(e){const c=e&&e.code;
      if(c==='declined')toast('저장을 취소했어요','warn');else if(c==='rate_limited')toast('잠시 후 다시 눌러 주세요','warn');else{fallbackDownload(fn,data);}}return;}
  fallbackDownload(fn,data);
}
function fallbackDownload(fn,data){try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('저장 파일을 내려받았어요');}
  catch(e){toast('이 화면에서는 파일로 저장할 수 없어요. 앱이나 브라우저에서 열어 주세요','warn');}}
let fileInp=null;
function pickSaveFile(){
  if(!fileInp){fileInp=document.createElement('input');fileInp.type='file';fileInp.accept='.json,application/json,text/plain';fileInp.style.display='none';document.body.appendChild(fileInp);
    fileInp.addEventListener('change',()=>{const f=fileInp.files&&fileInp.files[0];fileInp.value='';if(!f)return;
      if(f.size>30*1024*1024){toast('파일이 너무 커요','warn');return;}
      const rd=new FileReader();rd.onerror=()=>toast('파일을 읽지 못했어요','warn');rd.onload=()=>confirmImport(String(rd.result||''),f.name);rd.readAsText(f);});}
  fileInp.click();
}
function parseSaveFile(txt){let o;try{o=JSON.parse(txt.replace(/^﻿/,''));}catch(e){return null;}
  const sv=o&&o.format===SAVEFMT&&o.save?o.save:o;
  if(!sv||typeof sv!=='object'||!sv.S||!sv.a||!sv.a.kind||!Array.isArray(sv.bid)||!sv.S.buildings)return null;
  return{sv,city:o.city||sv.S.name||'이름 없는 도시',pop:o.pop,day:o.day!=null?o.day:sv.S.day,at:o.savedAt};}
function confirmImport(txt,fname){const p=parseSaveFile(txt);
  if(!p){toast('그리드시티 저장 파일이 아니거나 손상됐어요','warn');return;}
  const wasSetup=S.setup;const when=p.at?new Date(p.at).toLocaleString('ko-KR'):'';
  openSheet('import',head('저장 파일 불러오기',esc(fname))+`<div class="kv"><span>도시</span><span>${esc(p.city)}</span>${p.pop!=null?`<span>인구</span><span>${fmt(p.pop)}명</span>`:''}${p.day!=null?`<span>게임 날짜</span><span>${dateStr(p.day)}</span>`:''}${when?`<span>저장한 때</span><span>${when}</span>`:''}</div>
    <div class="issue">${wasSetup?'이 파일의 도시로 시작해요.':'지금 하던 도시는 이 파일로 바뀌어요. 필요하면 먼저 <b>파일로 저장</b>해 두세요.'}</div>
    <div class="rowbtns"><button class="btn big" id="impYes">불러오기</button><button class="btn ghost" id="impNo">취소</button></div>`);
  $('#sheet').querySelector('.x')?.addEventListener('click',()=>{wasSetup?openNew():closeSheet();});
  $('#impNo').onclick=()=>{wasSetup?openNew():closeSheet();};
  $('#impYes').onclick=()=>{const backup=wasSetup?null:serialize();
    try{load(JSON.parse(JSON.stringify(p.sv)));S.setup=false;if(!S.speed)S.speed=1;}
    catch(e){console.error(e);if(backup){try{load(backup);}catch(e2){}}toast('불러오는 중 문제가 생겨 원래 도시로 돌아갔어요','warn');if(wasSetup)openNew();return;}
    tut=null;$('#coach').hidden=true;$('#sheet').hidden=true;sheetKind=null;selTile=null;pickCat('pan');hudDirty=true;save();updateTicker();toast(`${S.name} 불러오기 완료`);};
}
function save(){if(S.setup)return;try{localStorage.setItem(KEY,JSON.stringify(serialize()));}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();});

/* ---------- loop ---------- */
let lastT=performance.now(),accT=0,hudT=0;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  const sp=[0,1,2,4][S.speed];accT+=dt*sp;let n=0;while(accT>=.22&&n<8){accT-=.22;dayTick();n++;}if(n>=8)accT=0;
  const kp=420*dt/cam.z;if(keys.has('w')||keys.has('arrowup'))cam.y-=kp;if(keys.has('s')||keys.has('arrowdown'))cam.y+=kp;if(keys.has('a')||keys.has('arrowleft'))cam.x-=kp;if(keys.has('d')||keys.has('arrowright'))cam.x+=kp;if(keys.size)clampCam();
  tutTick(dt);updateVehicles(dt*sp);updateRaid(dt*sp);updateJets(dt*Math.max(1,sp));updateParts(dt*(sp?1:0));
  if(((now/700)|0)!==frame.tk){frame.tk=(now/700)|0;readTheme();}
  try{render(now/1000);}catch(e){if(!frame.err){frame.err=1;console.error(e);}try{ctx.restore();}catch(_){}}
  hudT+=dt;if(hudDirty&&hudT>.2){hudT=0;updateHUD();}
  requestAnimationFrame(frame);
}
function start(data){
  let o=data&&data.save,raw=null;
  if(!o){try{raw=localStorage.getItem(KEY);if(!raw)for(const k of OLDKEYS){raw=localStorage.getItem(k);if(raw)break;}if(raw)o=JSON.parse(raw);}catch(e){o=null;}}
  let fresh=false;
  try{if(o)load(migrateSave(o));else{newCity('river','normal');fresh=true;}}
  catch(e){console.error(e);try{if(raw)localStorage.setItem('gridcity-save-broken-'+Date.now(),raw);}catch(e2){}newCity('river','normal');fresh=true;setTimeout(()=>toast('예전 저장을 불러오지 못해 새 도시로 시작했어요. 예전 저장은 지우지 않고 보관했어요','warn'),1200);}
  buildTools();pickCat(data&&data.cat||'pan');updateHUD();updateTicker();updatePenChip();
  if(fresh||S.setup)openNew();
  window.claude?.hot?.snapshot?.(()=>({save:serialize(),cat:curCat}));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
