<style>
/* Layout: full-bleed isometric map; HUD built like green highway signage — white-bordered sign panels pinned top and bottom */
:root{
  --sign:#145437; --sign-deep:#0e3f29; --sign-hi:#1b6644;
  --ink:#f4f2e8; --ink-dim:#b8cbbd; --rim:#f4f2e8;

}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.building{cursor:crosshair}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.hud-top,.hud-bot{position:fixed;left:0;right:0;z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.hud-top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
.hud-bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
.hud-top>*,.hud-bot>*{pointer-events:auto;width:100%;max-width:820px}

.sign{background:var(--sign);border-radius:12px;box-shadow:inset 0 0 0 2px var(--sign),inset 0 0 0 4px var(--rim),0 6px 18px rgba(0,0,0,.35)}
.top{padding:9px 12px 10px;display:flex;flex-direction:column;gap:7px}
.row1,.row2{display:flex;align-items:center;gap:10px;min-width:0}
.ident{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.cityname{font-weight:800;font-size:17px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tier{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--sign-deep);background:var(--ink);border-radius:4px;padding:2px 6px 1px;white-space:nowrap}
.date{font-family:var(--f-num);font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.speed{display:flex;background:var(--sign-deep);border-radius:7px;padding:2px}
.speed button{font-family:var(--f-num);font-size:11px;font-weight:700;padding:5px 7px 4px;border-radius:5px;color:var(--ink-dim);letter-spacing:-.08em;min-width:28px}

.money{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05;padding:3px 8px;border-radius:7px;background:var(--sign-deep)}

.money #money.neg{color:var(--bad)}
.net{font-family:var(--f-num);font-size:10.5px;color:var(--ink-dim)}
.net.up{color:#9fe0a8}.net.down{color:#ffb0a6}
.stat{display:flex;flex-direction:column;line-height:1.1}
.lbl{font-size:10px;letter-spacing:.1em;color:var(--ink-dim)}
.num{font-family:var(--f-num);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.rci{display:flex;gap:4px;align-items:flex-end;margin-left:auto}
.bar{display:flex;flex-direction:column;align-items:center;gap:2px}
.bar .track{width:9px;height:28px;background:var(--sign-deep);border-radius:2px;position:relative;overflow:hidden}
.bar .track::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(244,242,232,.35)}
.bar .fill{position:absolute;left:0;right:0;transition:all .4s}

.iconbtn{height:34px;min-width:38px;padding:0 9px;border-radius:7px;background:var(--sign-deep);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}

.toast{pointer-events:none;background:var(--amber);color:var(--amber-ink);font-weight:600;font-size:13px;padding:7px 12px 5px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3);animation:tin .25s ease-out;max-width:100%;text-align:center}

.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}

.tray{padding:8px;display:flex;flex-direction:column;gap:6px}
.toolinfo{display:flex;gap:8px;align-items:baseline;padding:2px 6px 0;font-size:12.5px;color:var(--ink-dim);min-height:18px;min-width:0}

.nrow .nm{display:flex;flex-direction:column;min-width:0}.nrow .nm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nrow small{font-size:10.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pend{background:rgba(242,182,50,.14);border:1px solid rgba(242,182,50,.5);border-radius:8px;padding:9px 10px 8px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px}

ul.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
ul.news li{display:flex;gap:8px;line-height:1.4}ul.news li span{font-family:var(--f-num);font-size:11px;color:var(--ink-dim);flex:0 0 auto;padding-top:1px}

.dhead{display:flex;gap:10px;align-items:center}.dhead h3{margin:0}.dhead .stc{margin-left:auto}

/* ---------- networks ---------- */
function bComp(b){

    const ox=xx<b.x||xx>=b.x+b.size,oy=yy<b.y||yy>=b.y+b.size;if(ox===oy||!inb(xx,yy))continue;
    const k=yy*N+xx;if(isRoad(k))return T.comp[k];}
  return -1;
}
function nearWater(x,y,s){
  for(let yy=y-1;yy<=y+s;yy++)for(let xx=x-1;xx<=x+s;xx++){const ox=xx<x||xx>=x+s,oy=yy<y||yy>=y+s;if(ox===oy||!inb(xx,yy))continue;if(T.ter[yy*N+xx]===1)return true;}
  return false;
}
function label(arr,pass,list){

  for(let i=0;i<N*N;i++){if(!pass(i))continue;if(list)list.push(i);if(arr[i]>=0)continue;
    const id=out.length,c={edge:false,n:0};out.push(c);let h=0,t=0;q[t++]=i;arr[i]=id;
    while(h<t){const j=q[h++];c.n++;const x=j%N,y=(j/N)|0;if(x===0||y===0||x===N-1||y===N-1)c.edge=true;
      for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const k=ny*N+nx;if(pass(k)&&arr[k]<0){arr[k]=id;q[t++]=k;}}}}
  return out;
}
function recomputeNet(){
  roadList=[];comps=label(T.comp,isRoad,roadList);rcomps=label(T.rcomp,isRail);
  const acc=T.acc;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){let best=-1,bd=9;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const k=ny*N+nx;if(isRoad(k)){const d=Math.abs(dx)+Math.abs(dy);if(d<bd){bd=d;best=T.comp[k];}}}
    acc[y*N+x]=best;}
  for(const id in S.buildings){const b=S.buildings[id];b.comp=b.dmg>0?-1:bComp(b);}
}
function recomputeUtil(){
  const nc=comps.length,P=new Float64Array(nc),Wt=new Float64Array(nc);
  util={pS:0,pU:0,wS:0,wU:0};
  for(const id in S.buildings){const b=S.buildings[id],d=DEFS[b.type];if(b.comp<0)continue;
    if(d.power){P[b.comp]+=d.power;util.pS+=d.power;} if(d.water){Wt[b.comp]+=d.water;util.wS+=d.water;}}
  compP=new Uint8Array(nc);compW=new Uint8Array(nc);
  for(let c=0;c<nc;c++){compP[c]=P[c]>0?1:0;compW[c]=Wt[c]>0?1:0;}
  const{zone,kind,acc,lvl,pw,wt}=T;pw.fill(0);wt.fill(0);
  for(let i=0;i<N*N;i++){
    if(!zone[i]||kind[i])continue;const c=acc[i];if(c<0)continue;const L=lvl[i],z=zone[i];
    if(L===0){pw[i]=P[c]>0?1:0;wt[i]=Wt[c]>0?1:0;continue;}
    const np=PWR[z][L],nw=WTR[z][L];util.pU+=np;util.wU+=nw;

function addCircle(cx,cy,r,fn){for(let y=Math.floor(cy-r);y<=cy+r;y++)for(let x=Math.floor(cx-r);x<=cx+r;x++){if(!inb(x,y))continue;const d=Math.hypot(x+.5-cx,y+.5-cy);if(d<=r)fn(y*N+x,d);}}

function tripFactor(i){const c=T.cov[i];return c&32?.55:c&16?.75:1;}
function computeEnv(){

  for(let i=0;i<n;i++)if(T.kind[i]===7&&T.ap[i]===1)addPol(i%N+.5,(i/N|0)+.5,7,3);

  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;if(T.ter[i]===1){T.lv[i]=0;continue;}
    let v=24+(T.wn[i]?14:0)+(T.ter[i]===2?4:0)+T.parkB[i]*.6+T.lmB[i]*.7;const c=T.cov[i];

function updateStats(){

let airports=[],planes=[];
const CLSN=['운항 불가','소형기','중형기','대형기'],RWNEED=[0,6,10,16];
function computeAirports(){

function growth(){

  for(let n=0;n<260;n++){
    const i=(rnd()*N*N)|0;if(!zone[i]||kind[i])continue;
    const z=zone[i],L=lvl[i],c=acc[i];
    const ok=c>=0&&comps[c]&&comps[c].edge&&pw[i]&&wt[i];
    if(!ok){if(L>0){bad[i]=Math.min(255,bad[i]+1);if(bad[i]>5&&rnd()<.35){lvl[i]--;bad[i]=0;changed=true;}}continue;}
    bad[i]=0;const d=S.dem[z];

/* ---------- vehicles ---------- */
function bfs(a,b,pass){
  if(a===b)return[a];const prev=new Int32Array(N*N).fill(-1);const q=[a];prev[a]=a;
  for(let h=0;h<q.length;h++){const j=q[h];if(j===b)break;const x=j%N,y=(j/N)|0;
    for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const k=ny*N+nx;if(prev[k]<0&&pass(k)){prev[k]=j;q.push(k);}}}
  if(prev[b]<0)return null;const p=[b];let c=b;while(c!==a){c=prev[c];p.push(c);}return p.reverse();
}
const BUSC=['#2f5fb0','#3aa04a','#2f5fb0','#e05a3a'];
function rebuildVehicles(){
  buses=[];trains=[];
  for(const c in stopsByComp){const a=stopsByComp[c];if(a.length<2)continue;const nb=Math.min(8,a.length);
    for(let j=0;j<nb;j++){const s=a[j%a.length];buses.push({seq:a,k:(j+1)%a.length,path:[s],trail:[s],t:0,wait:j*1.2,v:1.5,col:BUSC[j%BUSC.length],len:1,pass:isRoad});}}
  rebuildPlanes();
  for(const c in stationsByComp){const a=stationsByComp[c];if(a.length<2)continue;
    const seq=[...a];for(let k=a.length-2;k>0;k--)seq.push(a[k]);
    const nt=a.length>=4?2:1;
    for(let j=0;j<nt;j++){const s=seq[(j*Math.floor(seq.length/2))%seq.length];trains.push({seq,k:((j*Math.floor(seq.length/2))+1)%seq.length,path:[s],trail:[s],t:0,wait:1+j*2,v:2.4,col:j%2?'#2a7fd4':'#3cb44a',len:4,pass:isRail});}}
}
function stepVehicle(v,dt,stopWait){
  if(v.wait>0){v.wait-=dt;return;}
  if(v.path.length<2){
    const target=v.seq[v.k];const head=v.path[0];
    let p=bfs(head,target,v.pass);
    if(p&&p.length>=2&&v.trail.length>=2&&p[1]===v.trail[v.trail.length-2]){v.trail.reverse();const nh=v.trail[v.trail.length-1];p=bfs(nh,target,v.pass);if(p)v.path=p;}
    else if(p&&p.length>=2)v.path=p;
    if(!p||p.length<2){v.k=(v.k+1)%v.seq.length;v.wait=.5;return;}
    v.t=0;
  }
  v.t+=dt*v.v;
  while(v.t>=1&&v.path.length>=2){v.t-=1;v.path.shift();v.trail.push(v.path[0]);if(v.trail.length>8)v.trail.shift();
    if(v.path.length===1){v.t=0;v.wait=stopWait;v.k=(v.k+1)%v.seq.length;break;}}
}
function along(v,d){
  let a,b,f;
  const t=v.path.length>=2?v.t:0;
  if(v.path.length>=2&&d<=t){a=v.path[0];b=v.path[1];f=t-d;}
  else{let rem=d-t,j=v.trail.length-1;while(rem>1&&j>1){rem-=1;j--;}
    if(j<1){a=v.trail[0];b=v.path.length>=2?v.path[1]:a;f=0;if(v.trail.length>1){a=v.trail[1];b=v.trail[0];f=1;}
      return pt(a,b,clamp(f,0,1));}
    b=v.trail[j];a=v.trail[j-1];f=1-rem;}
  return pt(a,b,clamp(f,0,1));

function pt(a,b,f){const ax=a%N+.5,ay=(a/N|0)+.5,bx=b%N+.5,by=(b/N|0)+.5;const A=P(ax,ay),B=P(bx,by);let dx=B[0]-A[0],dy=B[1]-A[1];const l=Math.hypot(dx,dy);if(l<.01){dx=HW;dy=HH;}const L=Math.hypot(dx,dy);

const CARC=['#ece9df','#c4392d','#2f6fb3','#e3b53a','#3a3d42','#5fa36a','#d9773a','#8e9aa3','#ffffff','#202326'];
function spawnCar(){
  if(roadList.length<2)return;
  let i=roadList[(rnd()*roadList.length)|0];const j=roadList[(rnd()*roadList.length)|0];if(T.traf[j]>T.traf[i])i=j;
  const nb=roadNb(i);if(!nb.length)return;
  cars.push({cur:i,prev:-1,next:nb[(rnd()*nb.length)|0],t:rnd(),v:1.3+rnd()*.9,life:15+rnd()*40,c:CARC[(rnd()*CARC.length)|0],taxi:rnd()<.12});
}
function roadNb(i){const x=i%N,y=(i/N)|0,o=[];for(const[dx,dy]of D4){const nx=x+dx,ny=y+dy;if(inb(nx,ny)&&isRoad(ny*N+nx))o.push(ny*N+nx);}return o;}
function updateVehicles(dt){
  const target=Math.min(220,roadList.length<2?0:3+Math.floor((st.trips*1.1)/28));
  if(dt>0&&cars.length<target&&rnd()<.5)spawnCar();
  for(let k=cars.length-1;k>=0;k--){const c=cars[k];

    c.life-=dt;c.t+=dt*c.v;
    if(c.t>=1){c.t-=1;c.prev=c.cur;c.cur=c.next;const nb=roadNb(c.cur);let opts=nb.filter(n=>n!==c.prev);if(!opts.length)opts=nb;if(!opts.length){cars.splice(k,1);continue;}c.next=opts[(rnd()*opts.length)|0];}
    if(c.life<0||(cars.length>target+4&&rnd()<.01))cars.splice(k,1);}
  if(dt>0){for(const b of buses)stepVehicle(b,dt,1.4);for(const t of trains)stepVehicle(t,dt,2.4);for(const p of planes)stepPlane(p,dt);}

/* ---------- building actions ---------- */
function lineTiles(a,b){
  const out=[],dx=b.x-a.x,dy=b.y-a.y,sx=Math.sign(dx),sy=Math.sign(dy);
  if(Math.abs(dx)>=Math.abs(dy)){for(let x=a.x;;x+=sx){out.push([x,a.y]);if(x===b.x)break;}if(dy)for(let y=a.y+sy;;y+=sy){out.push([b.x,y]);if(y===b.y)break;}}
  else{for(let y=a.y;;y+=sy){out.push([a.x,y]);if(y===b.y)break;}if(dx)for(let x=a.x+sx;;x+=sx){out.push([x,b.y]);if(x===b.x)break;}}
  return out;
}
function rectTiles(a,b){const out=[];for(let y=Math.min(a.y,b.y);y<=Math.max(a.y,b.y);y++)for(let x=Math.min(a.x,b.x);x<=Math.max(a.x,b.x);x++)out.push([x,y]);return out;}

function makePlan(tl,a,b){

      const ok=(k===0||k===4)&&T.ter[i]!==3&&!(T.zone[i]&&T.lvl[i]>0);

    if(tl==='runway')p.msg=`활주로 ${tiles.length}칸 · ${tiles.length>=16?'대형기':tiles.length>=10?'중형기':tiles.length>=6?'소형기':'6칸 이상 필요'}`;
    if(lm){p.any=false;p.msg=lm;p.tiles.forEach(q=>q.ok=false);}
  }else if(tl==='R'||tl==='C'||tl==='I'){

      const ok=land(i)&&!T.kind[i]&&T.zone[i]!==z&&!(T.zone[i]&&T.lvl[i]>0);

function relParts(i){const X=NAT[i],n=S.dip.n[i],D=S.dip,P=[];const lb=lab();

  const rp=Math.round((D.rep-50)/4);if(rp)P.push(['국제 평판',rp]);
  if(n.sanc)P.push(['우리의 경제 제재',-30]);

  if(D.faction){if(X.bloc===D.faction)P.push(['같은 진영',20+FX('opFaction')]);else if(X.bloc!=='non')P.push(['적대 진영',-20]);}
  for(let j=0;j<NAT.length;j++){if(j===i||!D.n[j].pact)continue;const Y=NAT[j];if(Y.rivals.includes(X.id)||X.rivals.includes(Y.id))P.push([`경쟁국 ${jo(Y.name,'과','와')} 동맹`,-15]);}
  const oa=FX('opAll');if(oa)P.push(['국가 정책·법률',oa]);
  if(X.bloc==='west'&&FX('opWest'))P.push(['자유 무역 정책',FX('opWest')]);

  if(n.war>0)P.push(['교전 상태',-60]);

/* daily tick */
function initNews(silent){S.news={pub:[],oil:100,hist:[],seen:S.day,flags:{},rc:0};if(silent)for(const a of SCEN)if(a.at<S.day)S.news.pub.push({id:a.id,v:0,d:a.at});}
function art(p){if(p.c)return{...p.c,d:p.d,key:p.id,kind:'react'};const a=SCN_BY[p.id];if(!a)return null;const v=p.v&&a.alt?{...a,...a.alt}:a;return{...v,body:[...v.body,...(p.x?[p.x]:[]),...(p.g||[])],d:p.d,key:p.id,kind:'scen'};}
function newsTick(){
  if(!S.news||!S.dip||S.setup)return;if(!S.news.flags)S.news.flags={};if(!S.mkt)initMkt();let n=0;
  for(const a of SCEN){if(a.at>S.day||S.news.pub.some(p=>p.id===a.id))continue;
    const v=a.cond&&!a.cond()?1:0;const V=v&&a.alt?a.alt:a;const w0=S.dip.wt,o0=S.news.oil;
    try{V.fx&&V.fx();}catch(e){}
    let x='';try{x=a.x?a.x(v):'';}catch(e){x='';}
    const dw=S.dip.wt-w0,eff={...(SHOCK[a.id+(v?'*':'')]||SHOCK[a.id]||{})};
    const est={...eff};est.home=(est.home||0)-dw*.003;est.world=(est.world||0)-dw*.004;est.def=(est.def||0)+dw*.004;if(S.news.oil!==o0)est.energy=(est.energy||0)+(S.news.oil-o0)/o0;
    mktShock(eff,V.h);
    const tone=dw<0?1:dw>0?-1:0,g=[];
    try{g.push(reactPara(a.nat,tone));g.push(mktPara(est));g.push(expertPara(a.cat));g.push(outlookPara(a.cat));}catch(e){}
    S.news.pub.push({id:a.id,v,d:S.day,x:x||undefined,g:g.filter(Boolean)});
    if(V.h.startsWith('[속보]')&&n<2){toast(V.h.replace('[속보] ','속보 · '),'warn');n++;}}
  if(S.day%30===0){S.news.hist.push({d:S.day,wt:Math.round(S.dip.wt),oil:Math.round(S.news.oil),rep:Math.round(S.dip.rep),tr:tradeCount()});if(S.news.hist.length>36)S.news.hist.shift();S.news.oil+=(100-S.news.oil)*.05;}
  updateTicker();
}
function updateTicker(){const el=$('#tickTxt');if(!el||!S.news)return;const L=S.news.pub[S.news.pub.length-1];const a=L?art(L):null;
  el.textContent=a?a.h.replace('[속보] ',''):'국제 뉴스가 여기에 올라온다';
  const unread=S.news.pub.filter(p=>p.d>S.news.seen).length;const d=$('#newsDot');if(d){d.hidden=!unread;d.textContent=unread>9?'9+':unread;}
  $('#ticker').classList.toggle('hot',!!(a&&a.h.startsWith('[속보]')&&S.day-L.d<20));}
function toDa(t){
  t=t.replace(/이에요/g,'이다').replace(/예요/g,'다');
  for(const[k,v]of[['해요','한다'],['돼요','된다'],['져요','진다'],['와요','온다'],['봐요','본다'],['줘요','준다'],['가요','간다'],['줄어요','준다'],['늘어요','는다']])t=t.split(k).join(v);
  return t.replace(/([가-힣])어요/g,(m,c)=>{const j=(c.charCodeAt(0)-0xAC00)%28;return j===20||c==='없'?c+'다':m;});}

function allNews(){
  const out=S.news.pub.map(p=>art(p)).filter(Boolean);
  const W=['쿠데타','정권','분쟁','경제 위기','미사일을 시험','정상회의','군비'];
  for(const l of (S.dip?S.dip.log:[])){if(l.nr||l.t.startsWith('[월드 와이어]'))continue;const intl=W.some(w=>l.t.includes(w))&&!l.t.includes('우리');out.push({key:'log'+l.d+'_'+l.t.length+'_'+l.t.charCodeAt(1),kind:'brief',cat:intl?'국제':'우리 도시',h:toDa(l.t.replace(/^\[[^\]]+\]\s*/,'')),d:l.d,tone:l.k,nat:[]});}

const isBr=a=>a.h&&a.h.startsWith('[속보]');
function thumb(a,big){const[c1,c2]=CATC[a.cat]||CATC['국제'];const fl=(a.nat||[]).slice(0,3).map(id=>{const X=NAT[NIDX(id)];return X?`<span class="nfl" style="${flagCss(X)}"></span>`:'';}).join('');
  return`<div class="nth${big?' big':''}" style="background:linear-gradient(135deg,${c1},${c2})"><svg viewBox="0 0 48 48" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${CATI[a.cat]||CATI['국제']}</svg><div class="nfls">${fl}</div>${isBr(a)?'<span class="nbr">속보</span>':''}</div>`;}
function spark(arr,col){if(arr.length<2)return'<svg class="nsp" viewBox="0 0 100 28"></svg>';const mn=Math.min(...arr),mx=Math.max(...arr),r=mx-mn||1;const pts=arr.map((v,i)=>`${(i/(arr.length-1)*96+2).toFixed(1)},${(25-(v-mn)/r*22).toFixed(1)}`).join(' ');const last=pts.split(' ').pop().split(',');
  return`<svg class="nsp" viewBox="0 0 100 28"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${col}"/></svg>`;}
function byline(a){let h=0;for(const ch of (a.key||''))h=(h*31+ch.charCodeAt(0))%997;return REPORTERS[h%REPORTERS.length];}
function openNews(){S.news.seen=S.day;updateTicker();const el=$('#news');el.hidden=false;renderNews();}
function closeNews(){$('#news').hidden=true;}
function renderNews(){
  const el=$('#news'),list=allNews(),D=S.dip;const sel=newsView.id?list.find(a=>a.key===newsView.id):null;
  const full=list.filter(a=>a.kind!=='brief');
  const brs=full.filter(isBr).slice(0,3);

  const H=S.news.hist;

      <div class="nby">${sel.kind!=='brief'?`${byline(sel)} 기자 · `:'월드 와이어 단신 · '}${dateStr(sel.d)}</div>${sel.kind!=='brief'?thumb(sel,true):''}
      ${(sel.body||[]).map(p=>`<p>${p}</p>`).join('')||`<p>${sel.h}</p>`}
      ${sel.imp?`<aside class="nimp"><h4>${S.name}에 미치는 영향</h4><p>${sel.imp}</p></aside>`:''}</article>`;
  }else{

  }

  el.querySelector('#nclose').onclick=closeNews;
  el.querySelector('#nback')?.addEventListener('click',()=>{newsView.id=null;renderNews();el.scrollTop=0;});

  const dwt=D.wt-M.pwt;M.pwt=D.wt;const doil=(oil-M.poil)/M.poil;M.poil=oil;
  const g=M.ppop>0?clamp((st.pop-M.ppop)/Math.max(300,M.ppop),-.05,.05):0;M.ppop=st.pop;
  const war=D.n.some(n=>n.war>0),hi=Math.max(0,D.wt-50);
  const dr={home:.0002+g*.3+(D.stab-50)*.000008-(war?.0003:0)-hi*.000015,world:.0003-hi*.00002,tech:.00035,def:.00005+D.wt*.000006+(war?.0004:0),energy:.0001,ship:.0002+tradeCount()*.00003,gold:.0001+Math.max(0,D.wt-40)*.00001,bond:.00012};
  const ev={home:-dwt*.003-Math.max(0,doil)*.1,world:-dwt*.004-Math.max(0,doil)*.15,tech:-dwt*.003,def:dwt*.004,energy:doil,ship:-dwt*.003-doil*.2,gold:dwt*.002,bond:dwt*.0006};
  const z=gauss(),r={};for(const f of FAC)r[f]=dr[f]+ev[f]+FSIG[f]*(FBETA[f]*z*.7+gauss()*.7);
  M.sh=M.sh.filter(s=>{if(s.d<=S.day){for(const f in s.f)r[f]+=s.f[f]*s.w;return false;}return true;});
  for(const f of FAC)r[f]=clamp(r[f],-.3,.35);M.F=r;
  stepAssets(M,r,g);
  if(!$('#pension').hidden)renderPen(true);
  updatePenChip();
}
function mktShock(eff,h){if(!S.mkt||!eff)return;const k=Object.keys(eff);if(!k.length)return;S.mkt.sh.push({d:S.day,f:eff,w:.7},{d:S.day+1,f:eff,w:.3});
  S.mkt.log.unshift({d:S.day,h:h.replace('[속보] ',''),f:eff});if(S.mkt.log.length>30)S.mkt.log.length=30;}

  const ph=k.map(([f,v],j)=>`${jo(FNAME[f],'은','는')} ${Math.abs(v*100).toFixed(1)}% ${v>0?(v>=.05?'급등했':'올랐'):(v<=-.05?'급락했':'내렸')}`);

/* ---------- invasion & air defense ---------- */
let raid=null;
const ENEMIES=['북방 연합','붉은 사막 공화국','칼라드 해양 제국','철의 군도 연방','회색 산맥 왕국'];
function maybeRaid(){
  if(S.setup||raid||S.day<180||st.pop<400)return;
  const lb=lab();const p=Math.min(.18,.05+st.pop/25000*.1)*M('raid',1)*(lb?(S.nukeReady?.35:1.3):1);
  if(rnd()<p)startRaid(false);
}
function defenders(){const out=[],radars=[];for(const id in S.buildings){const b=S.buildings[id],d=DEFS[b.type];if(b.comp<0)continue;if(d.radar)radars.push({x:b.x+b.size/2,y:b.y+b.size/2,r:d.radar});if(d.def)out.push(b);}return{out,radars};}
function startRaid(drill,ni){
  if(raid)return;const tg=[];for(let i=0;i<N*N;i++){if(T.kind[i]===3||(T.zone[i]&&T.lvl[i]>0&&!T.kind[i]))tg.push(i);}
  if(!tg.length){toast('공격받을 건물이 아직 없어요','warn');return;}
  const NN=ni!=null?S.dip.n[ni]:null;const enemy=ni!=null?NAT[ni].name:ENEMIES[(rnd()*ENEMIES.length)|0];let n=ni!=null?clamp(2+Math.round(effPow(ni)*1.1*(NN.war?1.25:1))+Math.floor(st.pop/2500),3,34):clamp(3+Math.floor(st.pop/700),3,30);
  if(!drill&&S.nukeReady&&lab()){if(rnd()<.4){toast(`${jo(enemy,'이','가')} 핵 억지력에 막혀 공습을 취소했어요`);return;}n=Math.max(3,Math.round(n*.6));}const{radars}=defenders();
  const allies=ni!=null?allyList(ni):[];const fighters=cntBld('airbase');
  raid={enemy,drill,ni,side:ni!=null?NAT[ni].dir:null,allyHit:Math.min(.25,allies.length*.07+(allies.length?FX('intercept'):0))+Math.min(.15,fighters*.06),left:n,total:n,spawn:radars.length?4:1.2,missiles:[],shots:[],booms:[],killed:0,hits:0,damaged:0,tg};
  document.body.classList.add('raid');$('#raidBadge').hidden=false;
  if(allies.length)setTimeout(()=>toast(`동맹국 ${jo(allies.map(j=>NAT[j].name).join(', '),'이','가')} 요격을 지원해요`),900);
  toast(drill?`모의 공습 훈련 시작 · 미사일 ${n}기 (실제 피해 없음)`:`${enemy}의 공습! 미사일 ${n}기 접근 중${radars.length?' · 레이더 조기 경보':''}`,'warn');
  if(S.speed===0)setSpeed(1);
}
function spawnMissile(){
  const lb=lab();const i=lb&&rnd()<.3?(lb.y+1)*N+lb.x+1:raid.tg[(rnd()*raid.tg.length)|0],tx=i%N+.5,ty=(i/N|0)+.5,side=raid.side!=null&&rnd()<.8?raid.side:(rnd()*4)|0,u=rnd()*N;
  const[sx,sy]=side===0?[-8,u]:side===1?[N+8,u]:side===2?[u,-8]:[u,N+8];
  raid.missiles.push({x:sx,y:sy,sx,sy,tx,ty,ti:i,dist:Math.hypot(tx-sx,ty-sy),v:2.3+rnd()*.8,dead:false,aimed:0});
}
const mAlt=m=>12+120*Math.min(1,Math.hypot(m.tx-m.x,m.ty-m.y)/m.dist/.55);
function boom(x,y,alt,big){raid.booms.push({x,y,alt,t:0,big});if(big){const p=P(x,y);for(let k=0;k<3;k++)smoke(p[0]+(k-1)*6,p[1]-4,1);}}
function updateRaid(dt){
  if(!raid||dt<=0)return;
  if(raid.left>0){raid.spawn-=dt;if(raid.spawn<=0){spawnMissile();raid.left--;raid.spawn=.45+rnd()*.9;}}
  for(const m of raid.missiles){if(m.dead)continue;const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy),s=m.v*dt;
    if(d<=s){m.dead=true;raid.hits++;boom(m.tx,m.ty,0,true);if(!raid.drill)hitTile(m.ti);continue;}m.x+=dx/d*s;m.y+=dy/d*s;}
  const{out,radars}=defenders();
  for(const b of out){const d=DEFS[b.type].def;b.cd=(b.cd||0)-dt;if(b.cd>0)continue;const cx=b.x+b.size/2,cy=b.y+b.size/2;
    let best=null,bd=1e9;for(const m of raid.missiles){if(m.dead||m.aimed>=2)continue;const dd=Math.hypot(m.x-cx,m.y-cy);if(dd<=d.r&&dd<bd){bd=dd;best=m;}}
    if(!best)continue;const rb=radars.some(r=>Math.hypot(r.x-cx,r.y-cy)<=r.r)?.15:0;best.aimed++;
    const o=P(cx,cy),q=up(P(best.x,best.y),mAlt(best));b.ang=Math.atan2(q[1]-(o[1]-9),q[0]-o[0]);
    raid.shots.push({cx,cy,m:best,t:0,dur:d.kind==='gun'?.28:.75,hit:rnd()<d.hit+rb+M('defHit',0)+(raid.allyHit||0)+FX('defHit')+(S.dip?(S.dip.ws-50)/500:0),kind:d.kind,big:b.size});b.cd=d.rl;}

/* ---------- save / load ---------- */
const B64=a=>{let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);};
const UB64=(s,a)=>{const t=atob(s);for(let i=0;i<t.length&&i<a.length;i++)a[i]=t.charCodeAt(i);};
const SAVED=['ter','el','tree','zone','lvl','kind','vr','bad','rl','stop','wn','ap'];
function serialize(){const a={};SAVED.forEach(k=>a[k]=B64(T[k]));return{N,S,a,bid:Array.from(T.bid),cam:{...cam}};}
function load(o){endRaidQuiet();T=alloc();const on=o.N||50;
  if(on===N){SAVED.forEach(k=>{if(o.a[k])UB64(o.a[k],T[k]);});o.bid.forEach((v,i)=>T.bid[i]=v);S=o.S;if(o.cam)Object.assign(cam,o.cam);}
  else{S=o.S;const oy=Math.floor((N-on)/2);genMap(S.seed,S.type||'river');
    for(let x=0;x<16;x++)for(let y=0;y<N;y++){const i=y*N+x;if(T.kind[i]===1){T.kind[i]=0;T.rl[i]=0;}}
    const tmp={};SAVED.forEach(k=>{tmp[k]=new Uint8Array(on*on);if(o.a[k])UB64(o.a[k],tmp[k]);});
    for(let y=0;y<on;y++)for(let x=0;x<on;x++){const si=y*on+x,di=(y+oy)*N+x;SAVED.forEach(k=>{T[k][di]=tmp[k][si];});T.bid[di]=o.bid[si]||0;}
    for(const id in S.buildings)S.buildings[id].y+=oy;S.hy=(S.hy||0)+oy;cam.x=(14-S.hy)*HW;cam.y=(14+S.hy)*HH;
    setTimeout(()=>toast(`맵이 ${N}×${N}으로 넓어졌어요. 기존 도시는 그대로 옮겨졌어요`),800);}
  ensureDip();if(!S.news)initNews(true);if(!S.news.flags)S.news.flags={};cars=[];parts=[];refreshAll(true);}
function save(){if(S.setup)return;try{localStorage.setItem(KEY,JSON.stringify(serialize()));}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save();});

/* ---------- loop ---------- */
let lastT=performance.now(),accT=0,hudT=0;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  const sp=[0,1,2,4][S.speed];accT+=dt*sp;let n=0;while(accT>=.22&&n<8){accT-=.22;dayTick();n++;}if(n>=8)accT=0;
  const kp=420*dt/cam.z;if(keys.has('w')||keys.has('arrowup'))cam.y-=kp;if(keys.has('s')||keys.has('arrowdown'))cam.y+=kp;if(keys.has('a')||keys.has('arrowleft'))cam.x-=kp;if(keys.has('d')||keys.has('arrowright'))cam.x+=kp;if(keys.size)clampCam();
  updateVehicles(dt*sp);updateRaid(dt*sp);updateJets(dt*Math.max(1,sp));updateParts(dt*(sp?1:0));
  render(now/1000);
  hudT+=dt;if(hudDirty&&hudT>.2){hudT=0;updateHUD();}
  requestAnimationFrame(frame);
}
function start(data){
  let o=data&&data.save;
  if(!o){try{const s=localStorage.getItem(KEY);if(s)o=JSON.parse(s);}catch(e){o=null;}}
  let fresh=false;
  try{if(o)load(o);else{newCity('river','normal');fresh=true;}}catch(e){newCity('river','normal');fresh=true;}
  buildTools();pickCat(data&&data.cat||'pan');updateHUD();updateTicker();updatePenChip();
  if(fresh||S.setup)openNew();
  window.claude?.hot?.snapshot?.(()=>({save:serialize(),cat:curCat}));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
